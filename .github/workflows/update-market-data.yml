name: Actualizar datos de mercado
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_market.py"
      - ".github/workflows/update-market-data.yml"
permissions:
  contents: write
concurrency:
  group: market-data
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pypdf
      - run: python scripts/update_market.py
      - name: Publicar datos actualizados
        run: |
          if [ -z "$(git status --porcelain -- data/market.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market.json
          git commit -m "Update market data"
          git pull --rebase origin main
          git push
