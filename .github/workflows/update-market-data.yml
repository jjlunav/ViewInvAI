name: Actualizar datos de mercado

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_market.py"
      - "requirements.txt"
      - ".github/workflows/update-market-data.yml"

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - name: Instalar dependencias fijadas
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip check
      - name: Comprobar integraciones de producción
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'ViewInvAI/1.0 (https://viewinvai.firebaseapp.com)' }}
          MARKET_PUBLISH_URL: ${{ vars.MARKET_PUBLISH_URL }}
          MARKET_PUBLISH_TOKEN: ${{ secrets.MARKET_PUBLISH_TOKEN }}
        run: |
          if [ -z "${SEC_USER_AGENT}" ]; then
            echo "::warning::SEC_USER_AGENT no está configurado; el snapshot conservará SEC previo pero no consultará EDGAR en esta ejecución."
          fi
          if [ -z "${MARKET_PUBLISH_URL}" ] || [ -z "${MARKET_PUBLISH_TOKEN}" ]; then
            echo "::warning::Publicador R2 no configurado; el snapshot se publicará en Git como fallback."
          fi
      - name: Actualizar datos
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'ViewInvAI/1.0 (https://viewinvai.firebaseapp.com)' }}
        run: python scripts/update_market.py
      - name: Publicar snapshot en R2 cuando esté configurado
        env:
          MARKET_PUBLISH_URL: ${{ vars.MARKET_PUBLISH_URL }}
          MARKET_PUBLISH_TOKEN: ${{ secrets.MARKET_PUBLISH_TOKEN }}
        run: |
          if [ -z "${MARKET_PUBLISH_URL}" ] || [ -z "${MARKET_PUBLISH_TOKEN}" ]; then
            echo "R2 publisher no configurado; se mantiene publicación Git como fallback."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -X PUT "${MARKET_PUBLISH_URL}?kind=snapshot" \
            -H "Authorization: Bearer ${MARKET_PUBLISH_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @data/market.json
          curl --fail-with-body --silent --show-error \
            -X PUT "${MARKET_PUBLISH_URL}?kind=version" \
            -H "Authorization: Bearer ${MARKET_PUBLISH_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @data/market-version.json
          if [ -s data/market-catalog-delta.json ]; then
            python - <<'PY'
          import json
          import os
          import time

          import requests

          path = "data/market-catalog-delta.json"
          with open(path, "r", encoding="utf-8") as fh:
              delta = json.load(fh)

          stocks = delta.get("stocks") or []
          if not stocks:
              print("Catálogo D1 sin cambios.")
              raise SystemExit(0)

          base_url = os.environ["MARKET_PUBLISH_URL"]
          token = os.environ["MARKET_PUBLISH_TOKEN"]
          separator = "&" if "?" in base_url else "?"
          url = base_url + separator + "kind=catalog"
          headers = {
              "Authorization": "Bearer " + token,
              "Content-Type": "application/json",
          }

          chunk_size = 100
          total = len(stocks)
          for offset in range(0, total, chunk_size):
              payload = {
                  "generation": delta["generation"],
                  "updatedAt": delta["updatedAt"],
                  "stocks": stocks[offset:offset + chunk_size],
              }
              last_error = None
              for attempt in range(1, 4):
                  try:
                      response = requests.put(url, headers=headers, json=payload, timeout=45)
                      response.raise_for_status()
                      result = response.json()
                      print(
                          f"Catálogo D1 {min(offset + chunk_size, total)}/{total}: "
                          f"{result.get('rows', 0)} filas, "
                          f"{result.get('tradeRepublicProducts', 0)} productos TR."
                      )
                      last_error = None
                      break
                  except Exception as exc:
                      last_error = exc
                      if attempt < 3:
                          time.sleep(attempt * 2)
              if last_error is not None:
                  raise last_error
          PY
          fi
      - name: Publicar datos actualizados
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- data/market.json data/market-version.json)" ]; then exit 0; fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          cp data/market.json /tmp/market.json
          cp data/market-version.json /tmp/market-version.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/market.json data/market.json
          cp /tmp/market-version.json data/market-version.json

          if git diff --quiet -- data/market.json data/market-version.json; then exit 0; fi

          git add data/market.json data/market-version.json
          git commit -m "Update market data"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push concurrente; reintentando ($attempt/3)..."
            sleep 2
          done

          echo "No se pudieron publicar los datos de mercado tras 3 intentos."
          exit 1
