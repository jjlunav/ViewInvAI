name: Actualizar datos de mercado

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    branches: [main]
    paths:
      - "scripts/update_market.py"
      - "requirements.txt"
      - ".github/workflows/update-market-data.yml"

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"
      - name: Instalar dependencias fijadas
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip check
      - name: Actualizar datos
        run: python scripts/update_market.py
      - name: Publicar datos actualizados
        env:
          GH_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain -- data/market.json)" ]; then exit 0; fi

          git config user.name "github-actions[bot]"
          git config user.email "4189824+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          cp data/market.json /tmp/market.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/market.json data/market.json

          if git diff --quiet -- data/market.json; then exit 0; fi

          git add data/market.json
          git commit -m "Update market data"

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push concurrente; reintentando ($attempt/3)..."
            sleep 2
          done

          echo "No se pudo publicar data/market.json tras 3 intentos."
          exit 1
