name: Investigación de señales de anticipación

# Mide con ~10 años de históricos qué señales, conocidas antes del movimiento, han batido al S&P 500
# a 20 y 60 sesiones (2017-2022 y 2023-hoy). Publica data/signal-research.json; la app no lo usa todavía.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/quant/research_signals.py, .github/workflows/research-signals.yml]

permissions:
  contents: write

concurrency:
  group: train-quant
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scripts/quant/requirements.txt"
      - name: Recuperar caché de históricos (la del entrenamiento semanal)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .quant-cache
          key: quant-history-${{ github.run_id }}
          restore-keys: quant-history-
      - name: Instalar dependencias fijadas
        run: python -m pip install --disable-pip-version-check -r scripts/quant/requirements.txt
      - name: Calcular y medir las señales
        env:
          OPENBLAS_NUM_THREADS: "2"
        run: python scripts/quant/research_signals.py
      - name: Guardar caché de históricos (también si algo falla)
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .quant-cache
          key: quant-history-${{ github.run_id }}
      - name: Publicar el informe
        run: |
          git config user.name "viewinvai-quant[bot]"
          git config user.email "quant@viewinvai.invalid"
          git add data/signal-research.json
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -m "Investigación de señales: informe con históricos"
          for i in 1 2 3 4; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push --quiet origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
