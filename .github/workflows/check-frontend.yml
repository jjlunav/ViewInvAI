              const row = document.querySelector('#entryResults [data-stock-key]');
              if (!row) return false;

              const nav = document.querySelector('#mobileBottomNav');
              if (!nav || getComputedStyle(nav).display === 'none' || nav.getBoundingClientRect().height < 50) {
                fail('fixed mobile navigation is not visible');
