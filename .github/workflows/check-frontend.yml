                          const mobileTitle = header && header.querySelector('.profile-title');
                          const mobileLive = header && header.querySelector('.profile-live');
                          const h = el => el ? Math.round(el.getBoundingClientRect().height) : -1;
                          document.body.dataset.mobileHeaderBackH = String(h(mobileBack));
                          document.body.dataset.mobileHeaderTitleH = String(h(mobileTitle));
                          document.body.dataset.mobileHeaderLiveH = String(h(mobileLive));
                          document.body.dataset.mobileHeaderActionsH = String(h(mobileActions));
                          document.body.dataset.mobileHeaderSpreadH = String(h(mobileSpread));
                          document.body.dataset.mobileHeaderSpread = mobileSpread ? getComputedStyle(mobileSpread).display : 'missing';
                          document.body.dataset.mobileHeaderActions = mobileActions ? getComputedStyle(mobileActions).display : 'missing';
                          document.body.dataset.mobileHeaderPageWidth = String(document.documentElement.scrollWidth);
                          document.body.dataset.mobileHeaderViewport = String(window.innerWidth);
                          if (!mobileSpread || getComputedStyle(mobileSpread).display === 'none') {
                            fail('mobile stock header hides BID/ASK');
                            return;
                          }
                          if (!mobileActions || getComputedStyle(mobileActions).display === 'none') {
                            fail('mobile stock header hides primary actions');
                            return;
                          }
                          const minFont = (selector, min, label) => {
                            const el = header.querySelector(selector);
                            const size = el ? parseFloat(getComputedStyle(el).fontSize || '0') : 0;
                            if (!el || size < min) {
                              fail('mobile stock header ' + label + ' is too small: ' + size + 'px');
                              return false;
                            }
                            return true;
                          };
                          if (!minFont('.profile-market', 6.4, 'market label') ||
                              !minFont('.profile-title p', 8.4, 'company name') ||
                              !minFont('.quote-side small', 6.4, 'BID/ASK label') ||
                              !minFont('.quote-side strong', 8.5, 'BID/ASK value') ||
                              !minFont('.profile-primary-actions .btn', 7.8, 'action button')) {
                            return;
                          }
                          const rectOf = el => el && getComputedStyle(el).display !== 'none' ? el.getBoundingClientRect() : null;
                          const intersects = (a, b, tolerance = 1) => {
                            if (!a || !b) return false;
                            const x = Math.min(a.right, b.right) - Math.max(a.left, b.left);
                            const y = Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top);
                            return x > tolerance && y > tolerance;
                          };
                          const headerParts = [mobileBack, mobileTitle, mobileLive, mobileActions].map(rectOf).filter(Boolean);
                          for (let i = 0; i < headerParts.length; i++) {
                            for (let j = i + 1; j < headerParts.length; j++) {
