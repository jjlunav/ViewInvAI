name: Validar frontend

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "score-engine.js"
      - "alerts.js"
      - "auth.js"
      - "index.html"
      - "styles.css"
      - "worker.js"
      - "wrangler.jsonc"
      - ".github/workflows/check-frontend.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validar sintaxis JavaScript
        run: |
          node --check score-engine.js
          node --check app.js
          node - <<'NODE'
          require('./score-engine.js');
          const e=globalThis.ViewInvAIScore;
          if(!e||typeof e.analyze!=='function')throw new Error('Shared score engine did not initialize');
          const strong=e.analyze({price:10,change:6,volume:500000,avgVolume:150000,relVolume:3,adx:32,rsi:58,ema20:9.5,ema50:9,perfWeek:8,perfMonth:15,spread:0.8,bid:9.99,ask:10.01,quoteAgeMs:5000,snapshotAgeMs:120000},[]);
          const weak=e.analyze({price:10,change:-8,volume:5000,avgVolume:100000,relVolume:.2,adx:10,rsi:25,ema20:11,ema50:12,spread:9,bid:9,ask:10},[]);
          if(!(strong.score>weak.score))throw new Error('Score engine ordering regression');
          if(!(strong.quality.score>weak.quality.score))throw new Error('Quality engine ordering regression');
          if(e.watchSignal(90,40)!=='WAIT')throw new Error('Low-quality data must block BUY');
          if(e.watchSignal(90,90)!=='BUY')throw new Error('High-quality strong score must allow BUY');
          if(e.positionSignal(80,40)!=='REVIEW')throw new Error('Low-quality position must require REVIEW');
          const dilution=e.analyze({price:10,change:5,volume:300000,avgVolume:100000,relVolume:3,adx:30,rsi:55,ema20:9.5,ema50:9,spread:1,bid:9.95,ask:10.05},[{eventKind:'news',date:new Date().toISOString(),type:'financing',title:'Registered direct offering',impactScore:90}]);
          if(!(dilution.score<strong.score))throw new Error('Dilution catalyst risk is not reducing score');
          console.log('Shared score engine: OK');
          NODE
      - name: Validar sintaxis de avisos
        run: node --check alerts.js
      - name: Validar sintaxis de autenticación
        run: node --check auth.js
      - name: Validar sintaxis de carteras
        run: node --check portfolio.js
      - name: Validar sintaxis backend
        run: node --check backend.js
      - name: Validar sintaxis Worker
        run: node --check worker.js
      - name: Comprobar estructura y seguridad basica
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from collections import Counter

          html = Path("index.html").read_text(encoding="utf-8")
          app = Path("app.js").read_text(encoding="utf-8")
          worker = Path("worker.js").read_text(encoding="utf-8")
          workflow = Path(".github/workflows/check-frontend.yml").read_text(encoding="utf-8")

          required = [
              "view-entry","view-recommendation","recommendationResults","view-future","view-calendar",
              "view-catalog","view-catalogUS","view-settings","catalogDetail","catalogUSDetail",
              "catalogSearch","catalogUSSearch","marketLeaders","mobileBottomNav","mobileMoreSheet"
          ]
          missing = [x for x in required if f'id="{x}"' not in html]
          if missing:
              raise SystemExit("Faltan IDs: " + ", ".join(missing))

          names = re.findall(r"(?m)^function\s+([A-Za-z_$][\w$]*)\s*\(", app)
          dup = sorted(name for name, count in Counter(names).items() if count > 1)
          if dup:
              raise SystemExit("Funciones duplicadas en app.js: " + ", ".join(dup))

          forbidden = {
              "eval()": r"\beval\s*\(",
              "new Function()": r"\bnew\s+Function\s*\(",
              "document.write()": r"\bdocument\.write\s*\(",
              "javascript: URL": r"javascript\s*:",
          }
          for label, pattern in forbidden.items():
              if re.search(pattern, app, re.I) or re.search(pattern, worker, re.I):
                  raise SystemExit("Patron peligroso detectado: " + label)

          if 'Access-Control-Allow-Origin": "*"' in worker or "Access-Control-Allow-Origin': '*'" in worker:
              raise SystemExit("CORS wildcard prohibido en worker.js")

          if re.search(r"\son[a-z]+\s*=", html, re.I):
              raise SystemExit("Handlers inline prohibidos en index.html")

          secret_patterns = {
              "GitHub token": r"\bgh[pousr]_[A-Za-z0-9_]{20,}\b",
              "GitHub fine-grained token": r"\bgithub_pat_[A-Za-z0-9_]{20,}\b",
              "OpenAI-style key": r"\bsk-[A-Za-z0-9_-]{20,}\b",
              "AWS access key": r"\bAKIA[0-9A-Z]{16}\b",
              "Private key": r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----",
          }
          joined = "\n".join([app, worker, html, workflow])
          for label, pattern in secret_patterns.items():
              if re.search(pattern, joined):
                  raise SystemExit("Posible secreto embebido: " + label)

          print("Frontend y comprobaciones de seguridad: OK")
          PY
      - name: Smoke test en navegador real
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::Chrome/Chromium no está disponible en el runner"
            exit 1
          fi

          rm -rf /tmp/catalyst-smoke /tmp/catalyst-chrome-profile
          mkdir -p /tmp/catalyst-smoke/data /tmp/catalyst-chrome-profile
          cp index.html score-engine.js app.js alerts.js auth.js portfolio.js styles.css /tmp/catalyst-smoke/
          cat > /tmp/catalyst-smoke/data/market.json <<'JSON'
          {"meta":{"updatedAt":"2026-09-23T20:00:00Z","eurUsd":1.1},"stocks":[{"tvSymbol":"NASDAQ:TEST","ticker":"TEST","name":"Smoke Test","exchange":"NASDAQ","currency":"USD","price":10.0,"changePct":5.0,"volume":100000,"avgVolume":50000,"relVolume":2.0,"premarketPrice":9.8,"premarketChangePct":3.0,"premarketVolume":20000,"postmarketPrice":10.2,"postmarketChangePct":4.0,"postmarketVolume":30000,"rsi":50,"adx":30,"ema20":9.5,"ema50":9.0,"tradeRepublicVerified":true,"tradeRepublicCandidate":true,"trIsin":"US0000000001","isin":"US0000000001","usIsin":"US0000000001","trTicker":"TEST","trExchange":"LSX","instrumentLinkStatus":"same_isin"}],"events":[]}
          JSON

          python - <<'PY'
          from pathlib import Path
          p = Path("/tmp/catalyst-smoke/index.html")
          html = p.read_text(encoding="utf-8")
          pre = r'''<script>
          window.addEventListener('error', (e) => {
            document.documentElement.dataset.runtimeError = String((e && (e.message || (e.error && e.error.message))) || 'runtime error');
          });
          window.addEventListener('unhandledrejection', (e) => {
            document.documentElement.dataset.runtimeError = String((e && e.reason && (e.reason.message || e.reason)) || 'unhandled rejection');
          });
          </script>
          '''
          html = html.replace('<script src="app.js', pre + '<script src="app.js', 1)
          inject = r'''
          <script>
          (() => {
            const started = Date.now();

            function fail(message) {
              document.body.dataset.smokeError = String(message);
              console.error('SMOKE_FAIL', message);
            }

            function waitForProfile() {
              const chart = document.querySelector('.tv-advanced-chart');
              const profileOpen = document.body.classList.contains('stock-detail-open');
              if (chart && profileOpen) {
                document.body.dataset.smokeProfile = 'ok';
                return;
              }
              if (Date.now() - started < 7500) {
                setTimeout(waitForProfile, 100);
                return;
              }
              fail('profile or TradingView chart did not open');
              document.body.dataset.smokeProfile = 'fail';
            }

            let entryOpened = false;
            function waitForRow() {
              if (!entryOpened) {
                const entryNav = document.querySelector('.nav-item[data-view="entry"]');
                if (entryNav) {
                  entryOpened = true;
                  entryNav.click();
                }
              }
              const row = document.querySelector('#entryResults [data-stock-key]');
              if (row) {
                document.body.dataset.smokeApp = 'ok';
                row.click();
                setTimeout(waitForProfile, 100);
                return;
              }
              if (Date.now() - started < 6000) {
                setTimeout(waitForRow, 100);
                return;
              }
              fail('entry row was not rendered');
              document.body.dataset.smokeApp = 'fail';
            }

            setTimeout(waitForRow, 100);
          })();
          </script>
          '''
          p.write_text(html.replace("</body>", inject + "\n</body>"), encoding="utf-8")
          PY

          cd /tmp/catalyst-smoke
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/catalyst-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --user-data-dir=/tmp/catalyst-chrome-profile \
            --virtual-time-budget=10000 \
            --dump-dom \
            http://127.0.0.1:4173/ \
            > /tmp/catalyst-dom.html 2> /tmp/catalyst-chrome.log

          if ! grep -q 'data-smoke-app="ok"' /tmp/catalyst-dom.html; then
            echo "::error::La aplicación no llegó a renderizar una acción"
            grep -o 'data-smoke-[^ >]*' /tmp/catalyst-dom.html || true
            grep -o 'data-runtime-error="[^"]*"' /tmp/catalyst-dom.html || true
            python - <<'PY'
          from pathlib import Path
          dom = Path("/tmp/catalyst-dom.html").read_text(encoding="utf-8", errors="replace")
          for needle in ('id="entrySessionText"', 'id="entryCount"', 'id="entryResults"'):
              pos = dom.find(needle)
              if pos >= 0:
                  print("\nDOM DEBUG", needle)
                  print(dom[max(0, pos-250):pos+1600])
          PY
            tail -100 /tmp/catalyst-chrome.log || true
            exit 1
          fi

          if ! grep -q 'data-smoke-profile="ok"' /tmp/catalyst-dom.html; then
            echo "::error::No se pudo abrir el detalle/gráfico en navegador real"
            grep -o 'data-smoke-[^ >]*' /tmp/catalyst-dom.html || true
            tail -100 /tmp/catalyst-chrome.log || true
            exit 1
          fi

          if grep -Eqi 'Uncaught|ReferenceError|TypeError|SyntaxError|SMOKE_FAIL' /tmp/catalyst-chrome.log; then
            cat /tmp/catalyst-chrome.log
            exit 1
          fi

          echo "Smoke test navegador: OK"

      - name: Smoke test movil, filtros y navegacion atras
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::Chrome/Chromium no está disponible en el runner"
            exit 1
          fi

          rm -rf /tmp/viewinvai-mobile /tmp/viewinvai-mobile-profile
          mkdir -p /tmp/viewinvai-mobile/data /tmp/viewinvai-mobile-profile
          cp index.html score-engine.js app.js alerts.js auth.js portfolio.js styles.css /tmp/viewinvai-mobile/
          cat > /tmp/viewinvai-mobile/data/market.json <<'JSON'
          {"meta":{"updatedAt":"2026-09-24T07:30:00Z","eurUsd":1.1},"stocks":[{"tvSymbol":"NASDAQ:TEST","ticker":"TEST","name":"Smoke Test Company","exchange":"NASDAQ","currency":"USD","price":10.0,"changePct":5.0,"volume":100000,"avgVolume":50000,"relVolume":2.0,"premarketPrice":9.8,"premarketChangePct":3.0,"premarketVolume":20000,"postmarketPrice":10.2,"postmarketChangePct":4.0,"postmarketVolume":30000,"rsi":50,"adx":30,"ema20":9.5,"ema50":9.0,"tradeRepublicVerified":true,"tradeRepublicCandidate":true,"trIsin":"US0000000001","isin":"US0000000001","usIsin":"US0000000001","trTicker":"TEST","trExchange":"LSX","instrumentLinkStatus":"same_isin"}],"events":[]}
          JSON

          python - <<'PY'
          from pathlib import Path
          p = Path("/tmp/viewinvai-mobile/index.html")
          html = p.read_text(encoding="utf-8")
          pre = r'''<script>
          window.addEventListener('error', (e) => {
            document.documentElement.dataset.runtimeError = String((e && (e.message || (e.error && e.error.message))) || 'runtime error');
          });
          window.addEventListener('unhandledrejection', (e) => {
            document.documentElement.dataset.runtimeError = String((e && e.reason && (e.reason.message || e.reason)) || 'unhandled rejection');
          });
          </script>
          '''
          html = html.replace('<script src="app.js', pre + '<script src="app.js', 1)
          inject = r'''
          <script>
          (() => {
            const started = Date.now();
            const fail = (message) => {
              document.body.dataset.mobileSmokeError = String(message);
              console.error('MOBILE_SMOKE_FAIL', message);
            };
            const wait = (fn, message, timeout = 7000) => {
              if (fn()) return;
              if (Date.now() - started < timeout) return setTimeout(() => wait(fn, message, timeout), 100);
              fail(message);
            };
            const inputValue = (selector, value) => {
              const el = document.querySelector(selector);
              if (!el) return false;
              el.value = value;
              el.dispatchEvent(new Event('input', {bubbles:true}));
              return true;
            };

            wait(() => {
              const entryButton = document.querySelector('.mobile-nav-item[data-mobile-view="entry"]');
              if (entryButton && !document.querySelector('#view-entry.active')) {
                entryButton.click();
                return false;
              }
              const row = document.querySelector('#entryResults [data-stock-key]');
              if (!row) return false;

              const nav = document.querySelector('#mobileBottomNav');
              if (!nav || getComputedStyle(nav).display === 'none' || nav.getBoundingClientRect().height < 50) {
                fail('fixed mobile navigation is not visible');
                return true;
              }
              document.body.dataset.mobileNav = 'ok';

              const fixedViews = [...document.querySelectorAll('.mobile-nav-item[data-mobile-view]')].map(x => x.dataset.mobileView);
              if (fixedViews.join(',') !== 'home,portfolios,recommendation,entry') {
                fail('fixed mobile navigation order is incorrect: ' + fixedViews.join(','));
                return true;
              }
              const more = document.querySelector('.mobile-nav-item[data-mobile-more]');
              if (!more) {
                fail('mobile More navigation item missing');
                return true;
              }
              more.click();
              const catalog = document.querySelector('.mobile-more-item[data-mobile-view="catalog"]');
              if (!catalog) {
                fail('catalog item missing from More menu');
                return true;
              }
              catalog.click();

              setTimeout(() => {
                const card = document.querySelector('#catalogResults .catalog-mobile-card');
                if (!card) {
                  fail('mobile catalog card did not render');
                  return;
                }
                document.body.dataset.mobileCatalog = 'ok';

                if (typeof catalogFilterMatch !== 'function' ||
                    !catalogFilterMatch(5, '4..6', 'number') ||
                    catalogFilterMatch(5, '6..7', 'number') ||
                    !catalogFilterMatch(250000, '200k..300k', 'number')) {
                  fail('catalog numeric range parser failed');
                  return;
                }
                document.body.dataset.mobileRange = 'ok';

                if (!inputValue('.catalog-col-filter[data-mode="tr"][data-col="tickerUs"]', 'TES')) {
                  fail('mobile column filter input missing');
                  return;
                }
                setTimeout(() => {
                  if (!document.querySelector('#catalogResults .catalog-mobile-card')) {
                    fail('matching mobile text filter removed expected result');
                    return;
                  }
                  if (!inputValue('.catalog-col-filter[data-mode="tr"][data-col="tickerUs"]', 'NOPE')) {
                    fail('mobile filter disappeared after rerender');
                    return;
                  }
                  setTimeout(() => {
                    if (document.querySelector('#catalogResults .catalog-mobile-card')) {
                      fail('non-matching mobile text filter did not remove result');
                      return;
                    }
                    document.body.dataset.mobileFilter = 'ok';

                    inputValue('.catalog-col-filter[data-mode="tr"][data-col="tickerUs"]', '');
                    setTimeout(() => {
                      const restored = document.querySelector('#catalogResults .catalog-mobile-card');
                      if (!restored) {
                        fail('catalog result did not return after clearing filter');
                        return;
                      }
                      restored.click();
                      setTimeout(() => {
                        if (!document.body.classList.contains('stock-detail-open')) {
                          fail('mobile stock profile did not open');
                          return;
                        }

                        const viewportWidth = window.innerWidth;
                        const pageWidth = document.documentElement.scrollWidth;
                        if (pageWidth > viewportWidth + 1) {
                          fail('mobile profile overflows horizontally: ' + pageWidth + ' > ' + viewportWidth);
                          return;
                        }

                        const bottom = document.querySelector('#mobileBottomNav');
                        const bottomRect = bottom && bottom.getBoundingClientRect();
                        if (!bottomRect || bottomRect.left < -1 || bottomRect.right > viewportWidth + 1) {
                          fail('mobile bottom navigation escapes viewport');
                          return;
                        }

                        window.scrollTo(0, Math.min(900, document.documentElement.scrollHeight - window.innerHeight));
                        setTimeout(() => {
                          const header = document.querySelector('.stock-profile-page .unified-stock-header');
                          const headerRect = header && header.getBoundingClientRect();
                          if (!headerRect || Math.abs(headerRect.top) > 2) {
                            fail('stock header is not sticky after scroll');
                            return;
                          }
                          if (document.documentElement.scrollWidth > window.innerWidth + 1) {
                            fail('mobile profile overflow appeared after scroll');
                            return;
                          }
                          document.body.dataset.mobileLayout = 'ok';

                          history.back();
                          setTimeout(() => {
                            if (document.body.classList.contains('stock-detail-open') ||
                                !document.querySelector('#view-catalog.active')) {
                              fail('browser back did not return from profile to catalog');
                              return;
                            }
                            document.body.dataset.mobileBack = 'ok';
                          }, 350);
                        }, 300);
                      }, 250);
                    }, 350);
                  }, 350);
                }, 350);
              }, 250);
              return true;
            }, 'application data did not render');
          })();
          </script>
          '''
          p.write_text(html.replace("</body>", inject + "\n</body>"), encoding="utf-8")
          PY

          cd /tmp/viewinvai-mobile
          python -m http.server 4174 --bind 127.0.0.1 >/tmp/viewinvai-mobile-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --window-size=390,844 \
            --force-device-scale-factor=1 \
            --user-data-dir=/tmp/viewinvai-mobile-profile \
            --virtual-time-budget=10000 \
            --dump-dom \
            http://127.0.0.1:4174/ \
            > /tmp/viewinvai-mobile-dom.html 2> /tmp/viewinvai-mobile-chrome.log

          for marker in mobile-nav mobile-catalog mobile-range mobile-filter mobile-layout mobile-back; do
            attr="data-$marker=\"ok\""
            if ! grep -q "$attr" /tmp/viewinvai-mobile-dom.html; then
              echo "::error::Fallo smoke móvil: $marker"
              grep -o 'data-mobile-[^ >]*' /tmp/viewinvai-mobile-dom.html || true
              grep -o 'data-runtime-error="[^"]*"' /tmp/viewinvai-mobile-dom.html || true
              tail -100 /tmp/viewinvai-mobile-chrome.log || true
              exit 1
            fi
          done

          if grep -Eqi 'Uncaught|ReferenceError|TypeError|SyntaxError|MOBILE_SMOKE_FAIL' /tmp/viewinvai-mobile-chrome.log; then
            cat /tmp/viewinvai-mobile-chrome.log
            exit 1
          fi

          echo "Smoke test móvil, filtros y navegación: OK"

          for spec in "360,800" "412,915"; do
            W="${spec%,*}"
            H="${spec#*,}"
            PROFILE="/tmp/viewinvai-mobile-profile-${W}"
            DOM="/tmp/viewinvai-mobile-dom-${W}.html"
            LOG="/tmp/viewinvai-mobile-chrome-${W}.log"
            rm -rf "$PROFILE"

            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --window-size="$W,$H" \
              --force-device-scale-factor=1 \
              --user-data-dir="$PROFILE" \
              --virtual-time-budget=10000 \
              --dump-dom \
              http://127.0.0.1:4174/ \
              > "$DOM" 2> "$LOG"

            if ! grep -q 'data-mobile-layout="ok"' "$DOM"; then
              echo "::error::Fallo responsive en viewport ${W}x${H}"
              grep -o 'data-mobile-smoke-error="[^"]*"' "$DOM" || true
              grep -o 'data-runtime-error="[^"]*"' "$DOM" || true
              tail -100 "$LOG" || true
              exit 1
            fi
          done

          echo "Barrido responsive 360/390/412 px: OK"
