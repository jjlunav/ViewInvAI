name: Validar frontend

on:
  push:
    branches: [main, fix/android-ui-0.6.7]
    paths:
      - "app.js"
      - "settings.js"
      - "market.js"
      - "navigation.js"
      - "stock-charts.js"
      - "stock-profile.js"
      - "stock-interactions.js"
      - "catalog.js"
      - "heatmap.js"
      - "events.js"
      - "stock-list.js"
      - "asset-card.js"
      - "asset-card.css"
      - "scripts/smoke_asset_cards.js"
      - "scripts/test-session-quotes.mjs"
      - "recommendation.js"
      - "help.js"
      - "bootstrap.js"
      - "market-session.js"
      - "score-engine.js"
      - "alerts.js"
      - "stock-notifications.js"
      - "auth.js"
      - "portfolio.js"
      - "funds.js"
      - "backend.js"
      - "index.html"
      - "styles.css"
      - "web-mobile.css"
      - "mobile-app.css"
      - "ui-density.css"
      - "mobile-app.js"
      - "worker.js"
      - "package.json"
      - "capacitor.config.json"
      - "migrations/**"
      - "data/funds.json"
      - "data/myinvestor-funds.json"
      - "scripts/update_funds.py"
      - "wrangler.jsonc"
      - ".github/workflows/check-frontend.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validar sintaxis JavaScript
        run: |
          node --check market-session.js
          node --check score-engine.js
          node --check app.js
          node --check settings.js
          node --check market.js
          node --check navigation.js
          node --check stock-charts.js
          node --check stock-profile.js
          node --check stock-interactions.js
          node --check catalog.js
          node --check heatmap.js
          node --check events.js
          node --check stock-list.js
          node scripts/test-session-quotes.mjs
          node --check asset-card.js
          node --check recommendation.js
          node --check help.js
          node --check bootstrap.js
          node --check mobile-app.js
          node --check stock-notifications.js
          node - <<'NODE'
          require('./market-session.js');
          const m=globalThis.ViewInvAIMarketSession;
          if(!m)throw new Error('Market session module did not initialize');
          const parts=(year,month,day,weekday,hour,minute)=>({year:String(year),month:String(month).padStart(2,'0'),day:String(day).padStart(2,'0'),weekday,hour:String(hour).padStart(2,'0'),minute:String(minute).padStart(2,'0')});
          if(m.usSession(parts(2026,9,26,'Sat',4,20))!=='previous')throw new Error('US weekend must resolve to previous session');
          if(m.usSession(parts(2026,12,25,'Fri',10,0))!=='previous')throw new Error('US Christmas must be closed');
          if(m.usSession(parts(2026,11,27,'Fri',12,30))!=='regular')throw new Error('US Black Friday must still be regular before 13:00 ET');
          if(m.usSession(parts(2026,11,27,'Fri',13,30))!=='postmarket')throw new Error('US Black Friday early close regression');
          if(m.lsxOpen(parts(2026,12,24,'Thu',10,0)))throw new Error('LSX 24 Dec 2026 must be closed');
          if(!m.lsxOpen(parts(2026,12,30,'Wed',13,30)))throw new Error('LSX 30 Dec must be open before 14:00');
          if(m.lsxOpen(parts(2026,12,30,'Wed',14,30)))throw new Error('LSX 30 Dec must close at 14:00');
          console.log('Market session module: OK');
          NODE
          node - <<'NODE'
          require('./score-engine.js');
          const e=globalThis.ViewInvAIScore;
          if(!e||typeof e.analyze!=='function')throw new Error('Shared score engine did not initialize');
          const strong=e.analyze({price:10,change:6,volume:500000,avgVolume:150000,relVolume:3,adx:32,rsi:58,ema20:9.5,ema50:9,perfWeek:8,perfMonth:15,spread:0.8,bid:9.99,ask:10.01,quoteAgeMs:5000,snapshotAgeMs:120000},[]);
          const weak=e.analyze({price:10,change:-8,volume:5000,avgVolume:100000,relVolume:.2,adx:10,rsi:25,ema20:11,ema50:12,spread:9,bid:9,ask:10},[]);
          if(!(strong.score>weak.score))throw new Error('Score engine ordering regression');
          if(!(strong.quality.score>weak.quality.score))throw new Error('Quality engine ordering regression');
          if(e.watchSignal(90,40)!=='WAIT')throw new Error('Low-quality data must block BUY');
          if(e.watchSignal(90,90)!=='BUY')throw new Error('High-quality strong score must allow BUY');
          if(e.positionSignal(80,40)!=='REVIEW')throw new Error('Low-quality position must require REVIEW');
          const dilution=e.analyze({price:10,change:5,volume:300000,avgVolume:100000,relVolume:3,adx:30,rsi:55,ema20:9.5,ema50:9,spread:1,bid:9.95,ask:10.05},[{eventKind:'news',date:new Date().toISOString(),type:'financing',title:'Registered direct offering',impactScore:90}]);
          if(!(dilution.score<strong.score))throw new Error('Dilution catalyst risk is not reducing score');
          const fdaApproved=e.analyze({price:10,change:0,volume:200000,avgVolume:200000,relVolume:1,adx:20,rsi:50,ema20:10,ema50:10,spread:1,bid:9.95,ask:10.05},[{eventKind:'news',date:new Date().toISOString(),type:'medical',fdaStatusKind:'approved',impactScore:92,title:'FDA · Aprobación'}]);
          const fdaCr=e.analyze({price:10,change:0,volume:200000,avgVolume:200000,relVolume:1,adx:20,rsi:50,ema20:10,ema50:10,spread:1,bid:9.95,ask:10.05},[{eventKind:'news',date:new Date().toISOString(),type:'medical',fdaStatusKind:'complete_response',impactScore:90,title:'FDA · Complete Response'}]);
          if(!(fdaApproved.catalyst.delta>0))throw new Error('Structured FDA approval must be a positive catalyst');
          if(!(fdaCr.catalyst.delta<0))throw new Error('Structured FDA Complete Response must be a negative catalyst');
          console.log('Shared score engine: OK');
          NODE
      - name: Validar arquitectura frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          shared = Path("styles.css").read_text(encoding="utf-8")
          web_mobile = Path("web-mobile.css").read_text(encoding="utf-8")
          native_css = Path("mobile-app.css").read_text(encoding="utf-8")
          density_css = Path("ui-density.css").read_text(encoding="utf-8")
          app = Path("app.js").read_text(encoding="utf-8")
          nav = Path("navigation.js").read_text(encoding="utf-8")
          html = Path("index.html").read_text(encoding="utf-8")

          narrow_shared = re.findall(r"@media\s*\([^)]*max-width\s*:\s*(\d+)px", shared, re.I)
          narrow_shared = [int(x) for x in narrow_shared if int(x) <= 760]
          if narrow_shared:
              raise SystemExit(f"styles.css vuelve a mezclar responsive movil: {narrow_shared[:8]}")

          if 'data-native-app' in shared or 'data-native-app' in web_mobile:
              raise SystemExit("La UI nativa no puede vivir en CSS web")

          media_count = len(re.findall(r"@media\s*\(", web_mobile))
          if media_count > 8:
              raise SystemExit(f"web-mobile.css vuelve a fragmentarse: {media_count} media queries")

          if 'html[data-native-app="1"]' not in native_css:
              raise SystemExit("mobile-app.css no esta aislado por data-native-app")

          forbidden_core = (
              "function renderNavigation",
              "function initAppHistory",
              "function initNativeBackHandling",
              "const NAV_ORDER",
              "function profileHeroHtml",
              "function renderTrNativeChart",
              "function openAiChat",
          )
          found = [item for item in forbidden_core if item in app]
          if found:
              raise SystemExit("app.js vuelve a mezclar navegacion: " + ", ".join(found))

          required_nav = (
              "function renderNavigation",
              "function initAppHistory",
              "function initNativeBackHandling",
              "const NAV_ORDER",
          )
          missing = [item for item in required_nav if item not in nav]
          if missing:
              raise SystemExit("navigation.js incompleto: " + ", ".join(missing))

          settings = Path("settings.js").read_text(encoding="utf-8")
          if "function initSettings" not in settings or "function applyTheme" not in settings or "function syncScreenWakeLock" not in settings:
              raise SystemExit("settings.js incompleto")
          market = Path("market.js").read_text(encoding="utf-8")
          if "function canonicalQuote" not in market or "function initTrLive" not in market or "function pollUsLive" not in market or "function pollFxLive" not in market:
              raise SystemExit("market.js incompleto")

          charts = Path("stock-charts.js").read_text(encoding="utf-8")
          profile = Path("stock-profile.js").read_text(encoding="utf-8")
          bootstrap = Path("bootstrap.js").read_text(encoding="utf-8")
          if "function renderTrNativeChart" not in charts or "function loadMiniChart" not in charts:
              raise SystemExit("stock-charts.js incompleto")
          if "function profileHeroHtml" not in profile or "function openAiChat" not in profile:
              raise SystemExit("stock-profile.js incompleto")
          interactions = Path("stock-interactions.js").read_text(encoding="utf-8")
          if "function initStockInteractions" not in interactions or "data-stock-key" not in interactions:
              raise SystemExit("stock-interactions.js incompleto")
          required_continuity = (
              "function initStockViewContinuity", "MutationObserver",
              ".stock-mobile-groups", ".reco-mobile-groups", ".portfolio-tabs-track",
              ".event-mobile-groups", ".catalog-mobile-groups", ".fund-mobile-groups",
              "'homeGroups'", "'entryResults'", "'recommendationResults'", "'portfolioApp'",
              "'fundPortfolioApp'", "'fundsApp'", "'futureResults'", "'calendarResults'",
              "'catalogResults'", "'catalogUSResults'", "'stockQuickDetail'", ".profile-tabs", "details.profile-disclosure"
          )
          missing_continuity = [item for item in required_continuity if item not in interactions]
          if missing_continuity:
              raise SystemExit("Continuidad de listas incompleta: " + ", ".join(missing_continuity))
          catalog = Path("catalog.js").read_text(encoding="utf-8")
          if "function renderCatalogTable" not in catalog or "function initCatalogInteractions" not in catalog:
              raise SystemExit("catalog.js incompleto")
          required_catalog_mobile = (
              "const CATALOG_MOBILE_GROUPS=", "function catalogMobileList",
              "data-catalog-mobile-group", "function catalogMobileRow"
          )
          missing_catalog_mobile = [item for item in required_catalog_mobile if item not in catalog]
          if missing_catalog_mobile:
              raise SystemExit("Catalogo movil tabulado incompleto: " + ", ".join(missing_catalog_mobile))
          heatmap = Path("heatmap.js").read_text(encoding="utf-8")
          if "function renderHeatmap" not in heatmap or "function initHeatmapInteractions" not in heatmap:
              raise SystemExit("heatmap.js incompleto")
          events = Path("events.js").read_text(encoding="utf-8")
          if "function stockEvents" not in events or "function renderFuture" not in events or "function renderCalendar" not in events:
              raise SystemExit("events.js incompleto")
          required_event_mobile = (
              "const EVENT_MOBILE_GROUPS=", "function eventMobileList",
              "data-event-mobile-group", "eventCompactListView()"
          )
          missing_event_mobile = [item for item in required_event_mobile if item not in events]
          if missing_event_mobile:
              raise SystemExit("Listados moviles de eventos incompletos: " + ", ".join(missing_event_mobile))
          stock_list = Path("stock-list.js").read_text(encoding="utf-8")
          if "function standardStockCard" not in stock_list or "function renderHome" not in stock_list or "function renderEntry" not in stock_list or "function initStockListInteractions" not in stock_list:
              raise SystemExit("stock-list.js incompleto")
          required_stock_mobile = (
              "const STOCK_MOBILE_GROUPS=", "function stockMobileList",
              "data-stock-mobile-group", "stockCompactListView()"
          )
          missing_stock_mobile = [item for item in required_stock_mobile if item not in stock_list]
          if missing_stock_mobile:
              raise SystemExit("Listado movil de acciones incompleto: " + ", ".join(missing_stock_mobile))
          recommendation = Path("recommendation.js").read_text(encoding="utf-8")
          if "function recommendationAnalysis" not in recommendation or "function renderRecommendation" not in recommendation or "function highConvictionRecommendation" not in recommendation:
              raise SystemExit("recommendation.js incompleto")
          help_ui = Path("help.js").read_text(encoding="utf-8")
          if "function initHelpSystem" not in help_ui or "function helpTextFor" not in help_ui:
              raise SystemExit("help.js incompleto")
          if not ("load(false);" in bootstrap or "load(true);" in bootstrap) or "window.ViewInvAI={" not in bootstrap:
              raise SystemExit("bootstrap.js no posee el arranque/API publica")
          funds = Path("funds.js").read_text(encoding="utf-8")
          if "root.ViewInvAIFunds=" not in funds or "/api/fund-portfolios" not in funds or "/api/fund-positions" not in funds:
              raise SystemExit("funds.js incompleto")
          required_fund_mobile = (
              "const MOBILE_GROUPS=", "data-fund-mobile-group", "function fundMobileGroup",
              "function fundMobileCellValue", "function compactFundsView"
          )
          missing_fund_mobile = [item for item in required_fund_mobile if item not in funds]
          if missing_fund_mobile:
              raise SystemExit("Comparador movil de fondos incompleto: " + ", ".join(missing_fund_mobile))
          if "label:'Tipo'" not in funds or "Rentabilidad" not in funds or "Costes" not in funds or "Ratios" not in funds or "Otros" not in funds:
              raise SystemExit("Faltan grupos del comparador movil de fondos")
          mobile_groups_pos = funds.find("const MOBILE_GROUPS=")
          first_returns = funds.find("{key:'returns'", mobile_groups_pos)
          first_general = funds.find("{key:'general'", mobile_groups_pos)
          if mobile_groups_pos < 0 or first_returns < 0 or first_general < 0 or first_returns > first_general:
              raise SystemExit("Rentabilidad debe ser la primera pestaña móvil de fondos")

          required_assets = (
              "web-mobile.css", "mobile-app.css", "ui-density.css", "settings.js", "market.js", "navigation.js", "mobile-app.js",
              "stock-charts.js", "events.js", "stock-list.js", "recommendation.js", "help.js", "stock-profile.js", "catalog.js", "heatmap.js", "stock-interactions.js", "funds.js", "bootstrap.js"
          )
          missing_assets = [item for item in required_assets if item not in html]
          if missing_assets:
              raise SystemExit("index.html no carga la arquitectura separada: " + ", ".join(missing_assets))

          if "profileGeneralPrimaryStats" not in profile or "profileFixedMarketSection" not in profile or "profile-market-sessions" not in profile or "profile-market-extra" not in profile:
              raise SystemExit("stock-profile.js no mantiene visibles los datos de mercado en General")
          if "stock-card-details" not in stock_list:
              raise SystemExit("stock-list.js no oculta metricas secundarias")
          if "reco-disclosure" not in recommendation:
              raise SystemExit("recommendation.js no oculta factores secundarios")
          required_reco_mobile = ("const RECO_MOBILE_GROUPS=", "function recommendationMobileList", "data-reco-mobile-group")
          missing_reco_mobile = [item for item in required_reco_mobile if item not in recommendation]
          if missing_reco_mobile:
              raise SystemExit("Ideas IA movil incompleto: " + ", ".join(missing_reco_mobile))
          interactions = Path("stock-interactions.js").read_text(encoding="utf-8")
          if "data-copy-isin" not in interactions or "function copyListIsin" not in interactions:
              raise SystemExit("Copia de ISIN no esta cableada")
          portfolio = Path("portfolio.js").read_text(encoding="utf-8")
          if "portfolio-position-more" not in portfolio:
              raise SystemExit("portfolio.js no aplica detalle progresivo")
          required_density = ("reco-disclosure", "portfolio-position-more")
          missing_density = [item for item in required_density if item not in density_css]
          if missing_density:
              raise SystemExit("ui-density.css incompleto: " + ", ".join(missing_density))

          cards_css = Path("asset-card.css").read_text(encoding="utf-8")
          if ".asset-card-details" not in cards_css or "asset-card.js" not in html or "asset-card.css" not in html:
              raise SystemExit("Falta el componente de tarjeta compartida")

          # Regresiones críticas de móvil/tablet y veracidad de cotizaciones.
          worker = Path("worker.js").read_text(encoding="utf-8")
          if 'pathname === "/api/portfolio-goal"' not in worker:
              raise SystemExit("Worker no enruta /api/portfolio-goal al backend")

          if "function verifiedDisplayQuote" not in market:
              raise SystemExit("Falta la cotización verificada con fallback explícito")
          if "preferTr?canonicalQuote(s,true):verifiedDisplayQuote(s,false,se)" not in stock_list:
              raise SystemExit("Las listas compactas no separan LSX exacto de la cotización EEUU")
          if "if(preferTr)return '';" not in stock_list:
              raise SystemExit("Las tarjetas TR pueden volver a mostrar pre/post de EEUU")
          if "function selectExtendedSessionQuote" not in stock_list or "sessionQuoteTimestamp" not in stock_list:
              raise SystemExit("Las sesiones PRE/POST pueden volver a elegirse sin cronologia verificable")
          if "displayQuote&&displayQuote.price" not in stock_list:
              raise SystemExit("Radar puede volver a mostrar filas sin precio verificable")
          if "getDisplayQuote" not in bootstrap:
              raise SystemExit("Carteras no pueden consumir la cotización verificada")
          alerts = Path("alerts.js").read_text(encoding="utf-8")
          if "function renderAlertPage" not in alerts or 'id="alertPageStatus"' not in html or 'id="alertPageList"' not in html:
              raise SystemExit("Avisos puede volver a quedar como pantalla negra")
          native_runtime = Path("native-runtime.js").read_text(encoding="utf-8")
          if "funds|market|market-version" not in native_runtime or "?local=1" not in app:
              raise SystemExit("La APK no prioriza snapshot remoto con fallback local")
          if "max-width:820px" not in stock_list or "max-width:820px" not in recommendation:
              raise SystemExit("Las listas compactas no cubren tablet")
          if ".asset-quote-source" not in cards_css:
              raise SystemExit("El fallback EEUU debe quedar identificado visualmente")
          print("Arquitectura frontend separada: OK")
          PY

      - name: Validar sintaxis de avisos
        run: node --check alerts.js
      - name: Validar sintaxis de autenticación
        run: node --check auth.js
      - name: Validar contrato de notificaciones
        run: |
          python - <<'PY'
          from pathlib import Path

          auth = Path("auth.js").read_text(encoding="utf-8")
          stock_notifications = Path("stock-notifications.js").read_text(encoding="utf-8")
          backend = Path("backend.js").read_text(encoding="utf-8")

          token_start = auth.find("if (token === lastRegisteredPushToken)")
          token_end = auth.find("const response = await apiFetch", token_start)
          token_block = auth[token_start:token_end]
          if token_start < 0 or "return true;" not in token_block or "enabled: true" not in token_block:
              raise SystemExit("El registro push repetido puede volver a reportarse como fallo")

          disable_start = stock_notifications.find("async function disableAll()")
          disable_end = stock_notifications.find("document.addEventListener('click'", disable_start)
          disable_block = stock_notifications[disable_start:disable_end]
          for required in ("method:'POST'", "newsEnabled:false", "pulseEnabled:false", "radarEnabled:false", "priceUpEnabled:false", "priceDownEnabled:false"):
              if required not in disable_block:
                  raise SystemExit("Desactivar todas no persiste correctamente: falta " + required)
          if "method:'DELETE'" in disable_block:
              raise SystemExit("Desactivar todas no debe borrar la preferencia y reactivar valores por defecto")

          required_backend = (
              "function notificationPreferenceForTarget",
              'notificationPreferenceAllows(assetNotificationPreference,"news_enabled",true)',
              'notificationPreferenceAllows(assetPreference,"news_enabled",true)',
              'type==="pulse-ai"||type==="radar-entry"',
              "created_at>=?",
              "WHERE COALESCE(g.opted_in_explicitly,0)=1 AND COALESCE(g.notifications_enabled,0)<>0 ORDER BY p.updated_at ASC LIMIT 24",
              'UPDATE notification_preferences SET updated_at=? WHERE id=?',
          )
          missing = [item for item in required_backend if item not in backend]
          if missing:
              raise SystemExit("Contrato backend de notificaciones incompleto: " + ", ".join(missing))
          index = Path("index.html").read_text(encoding="utf-8")
          styles = Path("styles.css").read_text(encoding="utf-8")
          portfolio = Path("portfolio.js").read_text(encoding="utf-8")
          if "opted_in_explicitly" not in backend:
              raise SystemExit("Las notificaciones deben requerir opt-in explícito")
          if 'id="globalNotificationsEnabled" type="checkbox" checked' in index:
              raise SystemExit("El master de notificaciones no puede venir activado por defecto")
          if "account-analysis-settings-card" in index:
              raise SystemExit("Seguimiento de cartera no debe aparecer en Settings")
          if "Aportación mensual" in portfolio or 'name="monthlyContributionEur"' in portfolio:
              raise SystemExit("Objetivo IA no debe pedir aportaciones mensuales")
          if "Plan recomendado ahora" not in portfolio:
              raise SystemExit("Objetivo IA debe mostrar un plan único y accionable")
          if "#view-heatmap:not(.active){display:none!important" not in styles:
              raise SystemExit("El mapa de calor puede invadir otras vistas")
          if "--positive:var(--green)" not in styles or "--negative:var(--red)" not in styles:
              raise SystemExit("Faltan colores semánticos de subida/bajada")
          if "portfolio-workbar-actions" not in portfolio:
              raise SystemExit("La barra de Carteras puede volver a descuadrarse")
          for required in ("portfolioGoalHoldingsSignature", "scheduleGoalPortfolioReview", "portfolioHasGoal"):
              if required not in portfolio:
                  raise SystemExit("Objetivo IA no sigue cambios reales de cartera: falta " + required)
          if "last_analysis_at=NULL,last_signal=NULL,last_confidence=NULL,last_score=NULL,last_snapshot_id=NULL" not in backend:
              raise SystemExit("Un movimiento de cartera no invalida el análisis anterior")
          if "CASE WHEN g.portfolio_id IS NOT NULL THEN 5" not in backend:
              raise SystemExit("Las posiciones con Objetivo IA no tienen seguimiento acelerado")
          if "portfolioPrimaryTabsHtml" in portfolio or 'data-portfolio-primary="goal"' in portfolio:
              raise SystemExit("Objetivo IA no puede volver a ser una pestaña global de Carteras")
          for required in ('data-portfolio-goal-toggle', 'class="portfolio-cash-row"', 'portfolioCashBalanceForm'):
              if required not in portfolio:
                  raise SystemExit("Falta control por cartera: " + required)
          if 'title="Añadir posición">+</button>' not in portfolio:
              raise SystemExit("Añadir posición debe usar el símbolo +")
          if 'name="targetDate"' in portfolio or "portfolioGoalRequiredContribution" in portfolio:
              raise SystemExit("Objetivo IA conserva opciones de planificación que no pertenecen al motor de rotación")
          if "sin avance semanal suficiente" not in portfolio or "revisión IA continua" not in portfolio:
              raise SystemExit("Objetivo IA no contempla rotación temprana o niveles operativos")
          if 'id="globalNotifyPortfolioGoal"' not in index or "notify_portfolio_goal" not in backend or "portfolio_goal_enabled" not in backend:
              raise SystemExit("Falta la categoría de notificación para Objetivo IA")
          if "scanPortfolioGoalNotifications" not in backend or 'route:"portfolio-goal"' not in backend:
              raise SystemExit("Objetivo IA no puede avisar cambios en segundo plano")
          if "wholeRecommendationUnits" not in portfolio or "Math.floor(Math.max(0,budget-feeEur)/row.execution.unitEur)" not in portfolio:
              raise SystemExit("Las recomendaciones deben operar con acciones enteras y comisiones")
          if "finalists.push(ranked[2])" not in portfolio or "slice(0,3)" not in portfolio:
              raise SystemExit("El ranking estricto debe admitir como máximo tres entradas")
          if 'riskProfile||"aggressive"' not in portfolio:
              raise SystemExit("Objetivo IA debe usar perfil agresivo por defecto")
          stock_profile = Path("stock-profile.js").read_text(encoding="utf-8")
          stock_interactions = Path("stock-interactions.js").read_text(encoding="utf-8")
          for required in ("goalExecutionQuote", "spreadPenalty", "portfolioOperationFee", "data-register-goal-operation", "goalOperationForm"):
              if required not in portfolio:
                  raise SystemExit("Falta disciplina operativa en Objetivo IA: " + required)
          for required in ("cash_delta", "cash_currency", "adjustPortfolioCashForTransaction", "rawFees === null ? (preferTr ? 1 : 0)"):
              if required not in backend:
                  raise SystemExit("El efectivo automático o la comisión TR no están protegidos: " + required)
          for required in ("profileCompanyIdentityHtml", "profileCompanySummary", "ISIN", "data-profile-edit-position"):
              if required not in stock_profile:
                  raise SystemExit("La ficha General no expone todos los datos o edición de posición: " + required)
          if "openPositionEditorForStock" not in portfolio or "profileEditPosition" not in stock_interactions:
              raise SystemExit("No se puede editar una posición desde la ficha de la acción")
          print("Contrato de notificaciones y UI crítica: OK")
