                          return;
                        }

                        window.scrollTo(0, Math.min(900, document.documentElement.scrollHeight - window.innerHeight));
                        setTimeout(() => {
                          const header = document.querySelector('.stock-profile-page .unified-stock-header');
                          const headerRect = header && header.getBoundingClientRect();
                          const headerPosition = header ? getComputedStyle(header).position : '';
                          if (!headerRect || !['sticky','fixed'].includes(headerPosition)) {
                            fail('native stock header is not pinned during scroll: ' + headerPosition);
