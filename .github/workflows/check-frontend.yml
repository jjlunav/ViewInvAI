      - name: Comprobar estructura y seguridad basica
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from collections import Counter

          html = Path("index.html").read_text(encoding="utf-8")
          module_paths = [
              "app.js", "settings.js", "market.js", "stock-charts.js", "events.js", "stock-list.js", "recommendation.js", "help.js", "stock-profile.js",
              "navigation.js", "mobile-app.js", "bootstrap.js", "funds.js"
          ]
          modules = {path: Path(path).read_text(encoding="utf-8") for path in module_paths}
          app = modules["app.js"]
          profile = modules["stock-profile.js"]
          worker = Path("worker.js").read_text(encoding="utf-8")
          workflow = Path(".github/workflows/check-frontend.yml").read_text(encoding="utf-8")

          required = [
              "view-entry","view-recommendation","recommendationResults","view-future","view-calendar",
              "view-catalog","view-catalogUS","view-settings","catalogDetail","catalogUSDetail",
              "catalogSearch","catalogUSSearch","marketLeaders","mobileBottomNav","mobileMoreSheet",
              "view-funds","fundsApp","fundSearch","fundPortfolioApp"
          ]
          missing = [x for x in required if f'id="{x}"' not in html]
          if missing:
              raise SystemExit("Faltan IDs: " + ", ".join(missing))

          names = []
          for path, source in modules.items():
              names.extend(re.findall(r"(?m)^(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(", source))
          dup = sorted(name for name, count in Counter(names).items() if count > 1)
          if dup:
              raise SystemExit("Funciones duplicadas entre módulos frontend: " + ", ".join(dup))

          if profile.count('<header class="profile-hero investing-profile-header unified-stock-header">') != 1:
              raise SystemExit("La cabecera unificada debe tener una única plantilla")
          if "const hero=profileHeroHtml(s,isTr,opts);" not in profile:
              raise SystemExit("El shell de ficha dejó de reutilizar profileHeroHtml")
          if "function quickProfileHtml" not in profile or "return profileStickyShellHtml" not in profile:
              raise SystemExit("La ficha global no reutiliza el shell unificado")
          if "function renderEmbeddedStockDetail" in profile or "function renderProfileView" in profile or "function profileHtml" in profile:
              raise SystemExit("Queda una segunda implementación de ficha de acción")
          if 'data-profile-tab="general"' not in profile or 'data-profile-panel="general"' not in profile:
              raise SystemExit("La ficha no usa pestañas reales")
          if "function activateProfileTabData" not in profile:
              raise SystemExit("Falta carga diferida por pestaña")

          forbidden = {
              "eval()": r"\beval\s*\(",
              "new Function()": r"\bnew\s+Function\s*\(",
              "document.write()": r"\bdocument\.write\s*\(",
              "javascript: URL": r"javascript\s*:",
          }
          for label, pattern in forbidden.items():
              if any(re.search(pattern, source, re.I) for source in modules.values()) or re.search(pattern, worker, re.I):
                  raise SystemExit("Patron peligroso detectado: " + label)

          if 'Access-Control-Allow-Origin": "*"' in worker or "Access-Control-Allow-Origin': '*'" in worker:
              raise SystemExit("CORS wildcard prohibido en worker.js")

          if re.search(r"\son[a-z]+\s*=", html, re.I):
              raise SystemExit("Handlers inline prohibidos en index.html")

          secret_patterns = {
              "GitHub token": r"\bgh[pousr]_[A-Za-z0-9_]{20,}\b",
              "GitHub fine-grained token": r"\bgithub_pat_[A-Za-z0-9_]{20,}\b",
              "OpenAI-style key": r"\bsk-[A-Za-z0-9_-]{20,}\b",
              "AWS access key": r"\bAKIA[0-9A-Z]{16}\b",
              "Private key": r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----",
          }
          joined = "\n".join([*modules.values(), worker, html, workflow])
          for label, pattern in secret_patterns.items():
              if re.search(pattern, joined):
                  raise SystemExit("Posible secreto embebido: " + label)

          print("Frontend y comprobaciones de seguridad: OK")
          PY
