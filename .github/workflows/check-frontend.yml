                          if (intersects(rectOf(visualToggle), rectOf(externalChat), 2)) {
                            fail('native graph/AI and ChatGPT actions overlap');
                            return;
                          }
                          if (headerRect.height > 150) {
                            fail('native stock header is unexpectedly tall: ' + headerRect.height);
                            return;
                          }
                          if (document.documentElement.scrollWidth > window.innerWidth + 1) {
                            fail('mobile profile overflow appeared after scroll');
                            return;
                          }
                          document.body.dataset.mobileLayout = 'ok';

                          history.back();
                          setTimeout(() => {
                            if (document.body.classList.contains('stock-detail-open') ||
                                !document.querySelector('#view-catalog.active')) {
                              fail('browser back did not return from profile to catalog');
                              return;
                            }
                            document.body.dataset.mobileBack = 'ok';
                          }, 350);
                        }, 300);
                      }, 250);
                    }, 350);
                  }, 350);
                }, 350);
              }, 250);
              return true;
            }, 'application data did not render');
          })();
          </script>
          '''
          p.write_text(html.replace("</body>", inject + "\n</body>"), encoding="utf-8")
          PY

