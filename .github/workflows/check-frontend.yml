                const metrics = card.querySelector('.stock-list-metrics');
                if (metrics && parseFloat(getComputedStyle(metrics).fontSize || '0') < 8.5) {
                  fail('stock metrics are too small');
                  return;
                }
                document.body.dataset.smokeCards = 'ok';
                document.body.dataset.smokeApp = 'ok';
                document.body.dataset.smokeRowKey = String(row.dataset.stockKey || 'none');
                document.body.dataset.smokeRowStockFound = stockByKey(row.dataset.stockKey) ? 'yes' : 'no';
                document.addEventListener('click', event => {
                  if (event.target.closest && event.target.closest('[data-stock-key]') === row) {
                    document.body.dataset.smokeRowClickObserved = 'yes';
                  }
                }, {capture:true, once:true});
                profileStarted = Date.now();
                row.click();
                setTimeout(waitForProfile, 100);
                return;
              }
              if (Date.now() - started < 6000) {
                setTimeout(waitForRow, 100);
                return;
              }
              fail('entry row was not rendered');
              document.body.dataset.smokeApp = 'fail';
            }

            setTimeout(waitForRow, 100);
          })();
          </script>
          '''
          p.write_text(html.replace("</body>", inject + "\n</body>"), encoding="utf-8")
          PY

          cd /tmp/catalyst-smoke
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/catalyst-http.log 2>&1 &
