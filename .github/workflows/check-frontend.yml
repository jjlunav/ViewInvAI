name: Validar frontend

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "settings.js"
      - "market.js"
      - "navigation.js"
      - "stock-charts.js"
      - "stock-profile.js"
      - "stock-interactions.js"
      - "catalog.js"
      - "heatmap.js"
      - "events.js"
      - "stock-list.js"
      - "recommendation.js"
      - "help.js"
      - "bootstrap.js"
      - "market-session.js"
      - "score-engine.js"
      - "alerts.js"
      - "auth.js"
      - "portfolio.js"
      - "backend.js"
      - "index.html"
      - "styles.css"
      - "web-mobile.css"
      - "mobile-app.css"
      - "mobile-app.js"
      - "worker.js"
      - "package.json"
      - "capacitor.config.json"
      - "migrations/**"
      - "wrangler.jsonc"
      - ".github/workflows/check-frontend.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validar sintaxis JavaScript
        run: |
          node --check market-session.js
          node --check score-engine.js
          node --check app.js
          node --check settings.js
          node --check market.js
          node --check navigation.js
          node --check stock-charts.js
          node --check stock-profile.js
          node --check stock-interactions.js
          node --check catalog.js
          node --check heatmap.js
          node --check events.js
          node --check stock-list.js
          node --check recommendation.js
          node --check help.js
          node --check bootstrap.js
          node --check mobile-app.js
          node - <<'NODE'
          require('./market-session.js');
          const m=globalThis.ViewInvAIMarketSession;
          if(!m)throw new Error('Market session module did not initialize');
          const parts=(year,month,day,weekday,hour,minute)=>({year:String(year),month:String(month).padStart(2,'0'),day:String(day).padStart(2,'0'),weekday,hour:String(hour).padStart(2,'0'),minute:String(minute).padStart(2,'0')});
          if(m.usSession(parts(2026,9,26,'Sat',4,20))!=='previous')throw new Error('US weekend must resolve to previous session');
          if(m.usSession(parts(2026,12,25,'Fri',10,0))!=='previous')throw new Error('US Christmas must be closed');
          if(m.usSession(parts(2026,11,27,'Fri',12,30))!=='regular')throw new Error('US Black Friday must still be regular before 13:00 ET');
          if(m.usSession(parts(2026,11,27,'Fri',13,30))!=='postmarket')throw new Error('US Black Friday early close regression');
          if(m.lsxOpen(parts(2026,12,24,'Thu',10,0)))throw new Error('LSX 24 Dec 2026 must be closed');
          if(!m.lsxOpen(parts(2026,12,30,'Wed',13,30)))throw new Error('LSX 30 Dec must be open before 14:00');
          if(m.lsxOpen(parts(2026,12,30,'Wed',14,30)))throw new Error('LSX 30 Dec must close at 14:00');
          console.log('Market session module: OK');
          NODE
          node - <<'NODE'
          require('./score-engine.js');
          const e=globalThis.ViewInvAIScore;
          if(!e||typeof e.analyze!=='function')throw new Error('Shared score engine did not initialize');
          const strong=e.analyze({price:10,change:6,volume:500000,avgVolume:150000,relVolume:3,adx:32,rsi:58,ema20:9.5,ema50:9,perfWeek:8,perfMonth:15,spread:0.8,bid:9.99,ask:10.01,quoteAgeMs:5000,snapshotAgeMs:120000},[]);
          const weak=e.analyze({price:10,change:-8,volume:5000,avgVolume:100000,relVolume:.2,adx:10,rsi:25,ema20:11,ema50:12,spread:9,bid:9,ask:10},[]);
          if(!(strong.score>weak.score))throw new Error('Score engine ordering regression');
          if(!(strong.quality.score>weak.quality.score))throw new Error('Quality engine ordering regression');
          if(e.watchSignal(90,40)!=='WAIT')throw new Error('Low-quality data must block BUY');
          if(e.watchSignal(90,90)!=='BUY')throw new Error('High-quality strong score must allow BUY');
          if(e.positionSignal(80,40)!=='REVIEW')throw new Error('Low-quality position must require REVIEW');
          const dilution=e.analyze({price:10,change:5,volume:300000,avgVolume:100000,relVolume:3,adx:30,rsi:55,ema20:9.5,ema50:9,spread:1,bid:9.95,ask:10.05},[{eventKind:'news',date:new Date().toISOString(),type:'financing',title:'Registered direct offering',impactScore:90}]);
          if(!(dilution.score<strong.score))throw new Error('Dilution catalyst risk is not reducing score');
          const fdaApproved=e.analyze({price:10,change:0,volume:200000,avgVolume:200000,relVolume:1,adx:20,rsi:50,ema20:10,ema50:10,spread:1,bid:9.95,ask:10.05},[{eventKind:'news',date:new Date().toISOString(),type:'medical',fdaStatusKind:'approved',impactScore:92,title:'FDA · Aprobación'}]);
          const fdaCr=e.analyze({price:10,change:0,volume:200000,avgVolume:200000,relVolume:1,adx:20,rsi:50,ema20:10,ema50:10,spread:1,bid:9.95,ask:10.05},[{eventKind:'news',date:new Date().toISOString(),type:'medical',fdaStatusKind:'complete_response',impactScore:90,title:'FDA · Complete Response'}]);
          if(!(fdaApproved.catalyst.delta>0))throw new Error('Structured FDA approval must be a positive catalyst');
          if(!(fdaCr.catalyst.delta<0))throw new Error('Structured FDA Complete Response must be a negative catalyst');
          console.log('Shared score engine: OK');
          NODE
      - name: Validar arquitectura frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          shared = Path("styles.css").read_text(encoding="utf-8")
          web_mobile = Path("web-mobile.css").read_text(encoding="utf-8")
          native_css = Path("mobile-app.css").read_text(encoding="utf-8")
          app = Path("app.js").read_text(encoding="utf-8")
          nav = Path("navigation.js").read_text(encoding="utf-8")
          html = Path("index.html").read_text(encoding="utf-8")

          narrow_shared = re.findall(r"@media\s*\([^)]*max-width\s*:\s*(\d+)px", shared, re.I)
          narrow_shared = [int(x) for x in narrow_shared if int(x) <= 760]
          if narrow_shared:
              raise SystemExit(f"styles.css vuelve a mezclar responsive movil: {narrow_shared[:8]}")

          if 'data-native-app' in shared or 'data-native-app' in web_mobile:
              raise SystemExit("La UI nativa no puede vivir en CSS web")

          media_count = len(re.findall(r"@media\s*\(", web_mobile))
          if media_count > 8:
              raise SystemExit(f"web-mobile.css vuelve a fragmentarse: {media_count} media queries")

          if 'html[data-native-app="1"]' not in native_css:
              raise SystemExit("mobile-app.css no esta aislado por data-native-app")

          forbidden_core = (
              "function renderNavigation",
              "function initAppHistory",
              "function initNativeBackHandling",
              "const NAV_ORDER",
              "function profileHeroHtml",
              "function renderTrNativeChart",
              "function openAiChat",
          )
          found = [item for item in forbidden_core if item in app]
          if found:
              raise SystemExit("app.js vuelve a mezclar navegacion: " + ", ".join(found))

          required_nav = (
              "function renderNavigation",
              "function initAppHistory",
              "function initNativeBackHandling",
              "const NAV_ORDER",
          )
          missing = [item for item in required_nav if item not in nav]
          if missing:
              raise SystemExit("navigation.js incompleto: " + ", ".join(missing))

          settings = Path("settings.js").read_text(encoding="utf-8")
          if "function initSettings" not in settings or "function applyTheme" not in settings or "function syncScreenWakeLock" not in settings:
              raise SystemExit("settings.js incompleto")
          market = Path("market.js").read_text(encoding="utf-8")
          if "function canonicalQuote" not in market or "function initTrLive" not in market or "function pollUsLive" not in market or "function pollFxLive" not in market:
              raise SystemExit("market.js incompleto")

          charts = Path("stock-charts.js").read_text(encoding="utf-8")
          profile = Path("stock-profile.js").read_text(encoding="utf-8")
          bootstrap = Path("bootstrap.js").read_text(encoding="utf-8")
          if "function renderTrNativeChart" not in charts or "function loadMiniChart" not in charts:
              raise SystemExit("stock-charts.js incompleto")
          if "function profileHeroHtml" not in profile or "function openAiChat" not in profile:
              raise SystemExit("stock-profile.js incompleto")
          interactions = Path("stock-interactions.js").read_text(encoding="utf-8")
          if "function initStockInteractions" not in interactions or "data-stock-key" not in interactions:
              raise SystemExit("stock-interactions.js incompleto")
          catalog = Path("catalog.js").read_text(encoding="utf-8")
          if "function renderCatalogTable" not in catalog or "function initCatalogInteractions" not in catalog:
              raise SystemExit("catalog.js incompleto")
          heatmap = Path("heatmap.js").read_text(encoding="utf-8")
          if "function renderHeatmap" not in heatmap or "function initHeatmapInteractions" not in heatmap:
              raise SystemExit("heatmap.js incompleto")
          events = Path("events.js").read_text(encoding="utf-8")
          if "function stockEvents" not in events or "function renderFuture" not in events or "function renderCalendar" not in events:
              raise SystemExit("events.js incompleto")
          stock_list = Path("stock-list.js").read_text(encoding="utf-8")
          if "function standardStockCard" not in stock_list or "function renderHome" not in stock_list or "function renderEntry" not in stock_list or "function initStockListInteractions" not in stock_list:
              raise SystemExit("stock-list.js incompleto")
          recommendation = Path("recommendation.js").read_text(encoding="utf-8")
          if "function recommendationAnalysis" not in recommendation or "function renderRecommendation" not in recommendation or "function highConvictionRecommendation" not in recommendation:
              raise SystemExit("recommendation.js incompleto")
          help_ui = Path("help.js").read_text(encoding="utf-8")
          if "function initHelpSystem" not in help_ui or "function helpTextFor" not in help_ui:
              raise SystemExit("help.js incompleto")
          if "load(true);" not in bootstrap or "window.ViewInvAI={" not in bootstrap:
              raise SystemExit("bootstrap.js no posee el arranque/API publica")

          required_assets = (
              "web-mobile.css", "mobile-app.css", "settings.js", "market.js", "navigation.js", "mobile-app.js",
              "stock-charts.js", "events.js", "stock-list.js", "recommendation.js", "help.js", "stock-profile.js", "catalog.js", "heatmap.js", "stock-interactions.js", "bootstrap.js"
          )
          missing_assets = [item for item in required_assets if item not in html]
          if missing_assets:
              raise SystemExit("index.html no carga la arquitectura separada: " + ", ".join(missing_assets))

          print("Arquitectura frontend separada: OK")
          PY

      - name: Validar sintaxis de avisos
        run: node --check alerts.js
      - name: Validar sintaxis de autenticación
        run: node --check auth.js
      - name: Validar sintaxis de carteras
        run: node --check portfolio.js
      - name: Validar sintaxis backend
        run: node --check backend.js
      - name: Validar migraciones D1
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db=sqlite3.connect(':memory:')
          for path in sorted(Path('migrations').glob('*.sql')):
              db.executescript(path.read_text(encoding='utf-8'))
          tables={row[0] for row in db.execute("select name from sqlite_master where type='table'")}
          if 'transactions' not in tables:
              raise SystemExit('Falta tabla transactions')
          print('Migraciones D1: OK')
          PY
      - name: Validar sintaxis Worker
        run: node --check worker.js
      - name: Comprobar estructura y seguridad basica
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from collections import Counter

          html = Path("index.html").read_text(encoding="utf-8")
          module_paths = [
              "app.js", "settings.js", "market.js", "stock-charts.js", "events.js", "stock-list.js", "recommendation.js", "help.js", "stock-profile.js",
              "navigation.js", "mobile-app.js", "bootstrap.js"
          ]
          modules = {path: Path(path).read_text(encoding="utf-8") for path in module_paths}
          app = modules["app.js"]
          profile = modules["stock-profile.js"]
          worker = Path("worker.js").read_text(encoding="utf-8")
          workflow = Path(".github/workflows/check-frontend.yml").read_text(encoding="utf-8")

          required = [
              "view-entry","view-recommendation","recommendationResults","view-future","view-calendar",
              "view-catalog","view-catalogUS","view-settings","catalogDetail","catalogUSDetail",
              "catalogSearch","catalogUSSearch","marketLeaders","mobileBottomNav","mobileMoreSheet"
          ]
          missing = [x for x in required if f'id="{x}"' not in html]
          if missing:
              raise SystemExit("Faltan IDs: " + ", ".join(missing))

          names = []
          for path, source in modules.items():
              names.extend(re.findall(r"(?m)^(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(", source))
          dup = sorted(name for name, count in Counter(names).items() if count > 1)
          if dup:
              raise SystemExit("Funciones duplicadas entre módulos frontend: " + ", ".join(dup))

          if profile.count('<header class="profile-hero investing-profile-header unified-stock-header">') != 1:
              raise SystemExit("La cabecera unificada debe tener una única plantilla")
          if "return profileHeroHtml(s,isTr,{backKind,hideActions:opts.embedded===true})+" not in profile:
              raise SystemExit("El detalle rápido/embebido dejó de reutilizar profileHeroHtml")
          if "return profileHeroHtml(s,isTr,{backKind:'profile',backView:view})+" not in profile:
              raise SystemExit("El catálogo dejó de reutilizar profileHeroHtml")
          if "container.classList.add('stock-profile-page','embedded-stock-profile')" not in profile:
              raise SystemExit("El detalle de cartera dejó de reutilizar stock-profile-page")

          forbidden = {
              "eval()": r"\beval\s*\(",
              "new Function()": r"\bnew\s+Function\s*\(",
              "document.write()": r"\bdocument\.write\s*\(",
              "javascript: URL": r"javascript\s*:",
          }
          for label, pattern in forbidden.items():
              if any(re.search(pattern, source, re.I) for source in modules.values()) or re.search(pattern, worker, re.I):
                  raise SystemExit("Patron peligroso detectado: " + label)

          if 'Access-Control-Allow-Origin": "*"' in worker or "Access-Control-Allow-Origin': '*'" in worker:
              raise SystemExit("CORS wildcard prohibido en worker.js")

          if re.search(r"\son[a-z]+\s*=", html, re.I):
              raise SystemExit("Handlers inline prohibidos en index.html")

          secret_patterns = {
              "GitHub token": r"\bgh[pousr]_[A-Za-z0-9_]{20,}\b",
              "GitHub fine-grained token": r"\bgithub_pat_[A-Za-z0-9_]{20,}\b",
              "OpenAI-style key": r"\bsk-[A-Za-z0-9_-]{20,}\b",
              "AWS access key": r"\bAKIA[0-9A-Z]{16}\b",
              "Private key": r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----",
          }
          joined = "\n".join([*modules.values(), worker, html, workflow])
          for label, pattern in secret_patterns.items():
              if re.search(pattern, joined):
                  raise SystemExit("Posible secreto embebido: " + label)

          print("Frontend y comprobaciones de seguridad: OK")
          PY
      - name: Smoke test en navegador real
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::Chrome/Chromium no está disponible en el runner"
            exit 1
          fi

          rm -rf /tmp/catalyst-smoke /tmp/catalyst-chrome-profile
          mkdir -p /tmp/catalyst-smoke/data /tmp/catalyst-chrome-profile
          cp index.html market-session.js score-engine.js app.js settings.js market.js stock-charts.js events.js stock-list.js recommendation.js help.js stock-profile.js catalog.js heatmap.js stock-interactions.js navigation.js mobile-app.js bootstrap.js alerts.js auth.js portfolio.js styles.css web-mobile.css mobile-app.css /tmp/catalyst-smoke/
          cat > /tmp/catalyst-smoke/data/market.json <<'JSON'
          {"meta":{"updatedAt":"2026-09-23T20:00:00Z","eurUsd":1.1},"stocks":[{"tvSymbol":"NASDAQ:TEST","ticker":"TEST","name":"Smoke Test","exchange":"NASDAQ","currency":"USD","price":10.0,"changePct":5.0,"volume":100000,"avgVolume":50000,"relVolume":2.0,"premarketPrice":9.8,"premarketChangePct":3.0,"premarketVolume":20000,"postmarketPrice":10.2,"postmarketChangePct":4.0,"postmarketVolume":30000,"rsi":50,"adx":30,"ema20":9.5,"ema50":9.0,"tradeRepublicVerified":true,"tradeRepublicCandidate":true,"trIsin":"US0000000001","isin":"US0000000001","usIsin":"US0000000001","trTicker":"TEST","trExchange":"LSX","instrumentLinkStatus":"same_isin"}],"events":[]}
          JSON

          python - <<'PY'
          from pathlib import Path
          p = Path("/tmp/catalyst-smoke/index.html")
          html = p.read_text(encoding="utf-8")
          pre = r'''<script>
          window.addEventListener('error', (e) => {
            document.documentElement.dataset.runtimeError = String((e && (e.message || (e.error && e.error.message))) || 'runtime error');
          });
          window.addEventListener('unhandledrejection', (e) => {
            document.documentElement.dataset.runtimeError = String((e && e.reason && (e.reason.message || e.reason)) || 'unhandled rejection');
          });
          const smokeFetch = window.fetch.bind(window);
          window.fetch = (input, init) => {
            const url = typeof input === 'string' ? input : String(input && input.url || '');
            if (url.includes('/api/tr-history')) {
              const now = Date.now();
              const points = Array.from({length:80}, (_,i) => {
                const close = 9.5 + i * 0.008 + Math.sin(i/5) * 0.08;
                return {time:now-(79-i)*60000,open:close-0.02,high:close+0.05,low:close-0.05,close,volume:1000+i*15};
              });
              return Promise.resolve(new Response(JSON.stringify({isin:'US0000000001',exchange:'LSX',points,source:'smoke'}), {
                status:200,
                headers:{'Content-Type':'application/json'}
              }));
            }
            return smokeFetch(input, init);
          };
          window.open = (url) => {
            document.documentElement.dataset.externalOpen = String(url || '');
            return { closed:false };
          };
          </script>
          '''
          html = html.replace('<script src="app.js', pre + '<script src="app.js', 1)
          inject = r'''
          <script>
          (() => {
            const started = Date.now();

            function fail(message) {
              document.body.dataset.smokeError = String(message);
              console.error('SMOKE_FAIL', message);
            }

            function waitForProfile() {
              const root = document.querySelector('.stock-profile-page:not(.is-hidden)');
              const chart = root && root.querySelector('.tv-advanced-chart');
              const profileOpen = document.body.classList.contains('stock-detail-open');
              if (chart && profileOpen) {
                const toggle = root.querySelector('[data-profile-visual-toggle]');
                const visual = root.querySelector('[data-profile-visual-analysis]');
                if (!toggle || !visual || toggle.getAttribute('aria-expanded') !== 'false' || !visual.classList.contains('is-collapsed')) {
                  fail('chart/AI section is not collapsed by default');
                  return;
                }

                const header = root.querySelector('.unified-stock-header');
                const headerRect = header && header.getBoundingClientRect();
                if (!headerRect || headerRect.height > 125) {
                  fail('responsive stock header is too tall: ' + (headerRect ? headerRect.height : 'missing'));
                  return;
                }
                const parts = [
                  root.querySelector('.profile-back-cell'),
                  root.querySelector('.profile-title'),
                  root.querySelector('.profile-live'),
                  root.querySelector('.profile-primary-actions')
                ].filter(Boolean).filter(el => getComputedStyle(el).display !== 'none');
                const overlaps = (a,b) => {
                  const x=Math.min(a.right,b.right)-Math.max(a.left,b.left);
                  const y=Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top);
                  return x>2 && y>2;
                };
                for (let i=0;i<parts.length;i++) for (let j=i+1;j<parts.length;j++) {
                  if (overlaps(parts[i].getBoundingClientRect(),parts[j].getBoundingClientRect())) {
                    fail('responsive stock header elements overlap');
                    return;
                  }
                }
                document.body.dataset.smokeHeaderLayout = 'ok';

                const visibleChatgpt = root.querySelector('.profile-visual-toggle-row [data-chatgpt-stock]');
                const hiddenChatgpt = root.querySelector('.profile-ai-actions [data-chatgpt-stock]');
                if (!visibleChatgpt) {
                  fail('visible external ChatGPT button is missing next to the collapsed analysis control');
                  return;
                }
                if (hiddenChatgpt) {
                  fail('duplicate ChatGPT button remains inside the collapsed AI panel');
                  return;
                }
                const chatgpt = visibleChatgpt;
                if (!/Preguntar a ChatGPT/i.test(chatgpt.textContent || '')) {
                  fail('ChatGPT button label is not explicit');
                  return;
                }
                chatgpt.click();
                setTimeout(() => {
                  const external = String(document.documentElement.dataset.externalOpen || '');
                  if (!external.includes('https://chatgpt.com/?q=')) {
                    fail('ChatGPT prompt URL was not prepared');
                    return;
                  }
                  const encoded = external.split('?q=')[1] || '';
                  const prompt = decodeURIComponent(encoded);
                  if (/ViewInvAI/i.test(prompt)) {
                    fail('external ChatGPT prompt must not mention ViewInvAI');
                    return;
                  }
                  for (const required of ['noticias','catalizadores','redes','geopolítico','dilución','SEC']) {
                    if (!prompt.toLowerCase().includes(required.toLowerCase())) {
                      fail('external ChatGPT prompt missing research scope: ' + required);
                      return;
                    }
                  }
                  document.body.dataset.smokeChatgpt = 'ok';

                  const originalAuth = window.ViewInvAIAuth;
                  window.ViewInvAIAuth = Object.assign({}, originalAuth || {}, {getUser:()=>({uid:'smoke'}),signIn:()=>{}});
                  const internalAi = root.querySelector('[data-ai-chat-stock]');
                  if (!internalAi) {
                    fail('internal ViewInvAI button missing');
                    return;
                  }
                  internalAi.click();
                  const aiPanel = document.querySelector('#aiChatPanel');
                  if (!aiPanel || !aiPanel.classList.contains('open')) {
                    fail('internal ViewInvAI chat did not open');
                    return;
                  }
                  document.body.dataset.smokeAiChat = 'ok';
                  document.querySelector('#aiChatClose')?.click();

                  toggle.click();
                  setTimeout(() => {
                    if (toggle.getAttribute('aria-expanded') !== 'true' || visual.classList.contains('is-collapsed')) {
                      fail('chart/AI section did not expand');
                      return;
                    }

                    const waitForTrSelector = (deadline = Date.now() + 5000) => {
                      const trButton = root.querySelector('.chart-market-toggle[data-chart-market="tr"]');
                      if (trButton) {
                        trButton.click();
                        waitForNativeTrChart();
                        return;
                      }
                      if (Date.now() < deadline) {
                        setTimeout(() => waitForTrSelector(deadline), 50);
                        return;
                      }
                      fail('LSX market selector did not become available');
                    };

                    const waitForNativeTrChart = (deadline = Date.now() + 5000) => {
                      if (root.querySelector('.tr-native-chart')) {
                        document.body.dataset.smokeTrChart = 'ok';

                        window.dispatchEvent(new CustomEvent('viewinvai:portfolio-membership-changed'));
                        setTimeout(() => {
                          if (!root.querySelector('.tr-native-chart') ||
                              toggle.getAttribute('aria-expanded') !== 'true' ||
                              visual.classList.contains('is-collapsed')) {
                            fail('portfolio membership refresh destroyed the open stock analysis');
                            return;
                          }

                          applyTheme('light', true);
                          setTimeout(() => {
                            if (!root.querySelector('.tr-native-chart')) {
                              fail('theme change replaced the native LSX chart');
                              return;
                            }
                            applyTheme('dark', true);
                            toggle.click();
                            setTimeout(() => {
                            if (toggle.getAttribute('aria-expanded') !== 'false' || !visual.classList.contains('is-collapsed')) {
                              fail('chart/AI section did not collapse again');
                              return;
                            }
                            document.body.dataset.smokeProfile = 'ok';
                            document.body.dataset.smokeProfileCompact = 'ok';

                            const sourceChart = root.querySelector('.tv-advanced-chart');
                            const stockKey = sourceChart && sourceChart.dataset.stockKey;
                            const portfolioHost = document.createElement('div');
                            portfolioHost.className = 'portfolio-inline-stock';
                            document.body.appendChild(portfolioHost);
                            const rendered = stockKey && window.ViewInvAI &&
                              typeof window.ViewInvAI.renderEmbeddedStockDetail === 'function' &&
                              window.ViewInvAI.renderEmbeddedStockDetail(portfolioHost, stockKey, 'Cartera · Smoke', true);
                            const embeddedHeader = portfolioHost.querySelector('.unified-stock-header');
                            if (!rendered || !portfolioHost.classList.contains('stock-profile-page') || !embeddedHeader) {
                              fail('portfolio embedded stock detail did not reuse the unified profile');
                              return;
                            }
                            const embeddedStyle = getComputedStyle(embeddedHeader);
                            if (embeddedStyle.position !== 'sticky' || Math.abs(parseFloat(embeddedStyle.top || '0')) > 1) {
                              fail('portfolio embedded stock header is not sticky at the top');
                              return;
                            }
                            const embeddedToggle = portfolioHost.querySelector('[data-profile-visual-toggle]');
                            const embeddedVisual = portfolioHost.querySelector('[data-profile-visual-analysis]');
                            if (!embeddedToggle || !embeddedVisual ||
                                embeddedToggle.getAttribute('aria-expanded') !== 'false' ||
                                !embeddedVisual.classList.contains('is-collapsed')) {
                              fail('portfolio embedded chart/AI is not collapsed by default');
                              return;
                            }
                            const embeddedRect = embeddedHeader.getBoundingClientRect();
                            if (!embeddedRect || embeddedRect.height > 125) {
                              fail('portfolio embedded stock header is too tall');
                              return;
                            }
                            document.body.dataset.smokePortfolioSticky = 'ok';
                            }, 100);
                          }, 180);
                        }, 100);
                        return;
                      }

                      if (Date.now() < deadline) {
                        setTimeout(() => waitForNativeTrChart(deadline), 50);
                        return;
                      }
                      fail('LSX native chart did not render after selecting the Trade Republic market');
                    };

                    waitForTrSelector();
                  }, 50);
                }, 120);
                return;
              }
              if (Date.now() - (profileStarted || started) < 5000) {
                setTimeout(waitForProfile, 100);
                return;
              }
              const detail = document.querySelector('#stockQuickDetail');
              document.body.dataset.smokeProfileBodyOpen = document.body.classList.contains('stock-detail-open') ? 'yes' : 'no';
              document.body.dataset.smokeProfileStateKey = String((typeof state !== 'undefined' && state.profileKey) || 'none');
              document.body.dataset.smokeProfileDetailHidden = String(detail ? detail.classList.contains('is-hidden') : 'missing');
              document.body.dataset.smokeProfileDetailHtml = String(detail ? detail.innerHTML.length : -1);
              document.body.dataset.smokeProfileRenderFn = typeof renderQuickProfile;
              document.body.dataset.smokeProfileHistoryFn = typeof replaceCurrentAppHistory;
              document.body.dataset.smokeProfileHeroFn = typeof profileHeroHtml;
              fail('profile-open-failed');
              document.body.dataset.smokeProfile = 'fail';
            }

            let entryOpened = false;
            let profileStarted = 0;
            function waitForRow() {
              if (!entryOpened) {
                const entryNav = document.querySelector('.nav-item[data-view="entry"]');
                if (entryNav) {
                  entryOpened = true;
                  entryNav.click();
                }
              }
              const row = document.querySelector('#entryResults [data-stock-key]');
              if (row) {
                const nav = document.querySelector('.nav-item[data-view="entry"]');
                if (!nav || !/Radar de entrada/i.test(nav.textContent || '')) {
                  fail('Radar de entrada label missing');
                  return;
                }
                const card = row.closest('.investing-stock-card');
                const rect = card && card.getBoundingClientRect();
                if (!rect || rect.width > 550) {
                  fail('desktop stock card is too wide: ' + (rect ? rect.width : 'missing'));
