              const mainPaddingBottom = parseFloat(getComputedStyle(document.querySelector('.main')).paddingBottom || '0');
              if (mainPaddingBottom + 1 < nav.getBoundingClientRect().height) {
                fail('native content does not reserve space for bottom navigation');
