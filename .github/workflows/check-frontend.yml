name: Validar frontend

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "index.html"
      - "styles.css"
      - "worker.js"
      - "wrangler.jsonc"
      - ".github/workflows/check-frontend.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validar sintaxis JavaScript
        run: node --check app.js
      - name: Validar sintaxis Worker
        run: node --check worker.js
      - name: Comprobar estructura y seguridad basica
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from collections import Counter

          html = Path("index.html").read_text(encoding="utf-8")
          app = Path("app.js").read_text(encoding="utf-8")
          worker = Path("worker.js").read_text(encoding="utf-8")
          workflow = Path(".github/workflows/check-frontend.yml").read_text(encoding="utf-8")

          required = [
              "view-entry","view-recommendation","recommendationResults","view-future","view-calendar",
              "view-catalog","view-catalogUS","catalogDetail","catalogUSDetail",
              "catalogSearch","catalogUSSearch","marketLeaders"
          ]
          missing = [x for x in required if f'id="{x}"' not in html]
          if missing:
              raise SystemExit("Faltan IDs: " + ", ".join(missing))

          names = re.findall(r"(?m)^function\s+([A-Za-z_$][\w$]*)\s*\(", app)
          dup = sorted(name for name, count in Counter(names).items() if count > 1)
          if dup:
              raise SystemExit("Funciones duplicadas en app.js: " + ", ".join(dup))

          forbidden = {
              "eval()": r"\beval\s*\(",
              "new Function()": r"\bnew\s+Function\s*\(",
              "document.write()": r"\bdocument\.write\s*\(",
              "javascript: URL": r"javascript\s*:",
          }
          for label, pattern in forbidden.items():
              if re.search(pattern, app, re.I) or re.search(pattern, worker, re.I):
                  raise SystemExit("Patron peligroso detectado: " + label)

          if 'Access-Control-Allow-Origin": "*"' in worker or "Access-Control-Allow-Origin': '*'" in worker:
              raise SystemExit("CORS wildcard prohibido en worker.js")

          if re.search(r"\son[a-z]+\s*=", html, re.I):
              raise SystemExit("Handlers inline prohibidos en index.html")

          secret_patterns = {
              "GitHub token": r"\bgh[pousr]_[A-Za-z0-9_]{20,}\b",
              "GitHub fine-grained token": r"\bgithub_pat_[A-Za-z0-9_]{20,}\b",
              "OpenAI-style key": r"\bsk-[A-Za-z0-9_-]{20,}\b",
              "AWS access key": r"\bAKIA[0-9A-Z]{16}\b",
              "Private key": r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----",
          }
          joined = "\n".join([app, worker, html, workflow])
          for label, pattern in secret_patterns.items():
              if re.search(pattern, joined):
                  raise SystemExit("Posible secreto embebido: " + label)

          print("Frontend y comprobaciones de seguridad: OK")
          PY
      - name: Smoke test en navegador real
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::Chrome/Chromium no está disponible en el runner"
            exit 1
          fi

          rm -rf /tmp/catalyst-smoke /tmp/catalyst-chrome-profile
          mkdir -p /tmp/catalyst-smoke/data /tmp/catalyst-chrome-profile
          cp index.html app.js styles.css /tmp/catalyst-smoke/
          cat > /tmp/catalyst-smoke/data/market.json <<'JSON'
          {"meta":{"updatedAt":"2026-09-23T20:00:00Z","eurUsd":1.1},"stocks":[{"tvSymbol":"NASDAQ:TEST","ticker":"TEST","name":"Smoke Test","exchange":"NASDAQ","currency":"USD","price":10.0,"changePct":5.0,"volume":100000,"avgVolume":50000,"relVolume":2.0,"premarketPrice":9.8,"premarketChangePct":3.0,"premarketVolume":20000,"postmarketPrice":10.2,"postmarketChangePct":4.0,"postmarketVolume":30000,"rsi":50,"adx":30,"ema20":9.5,"ema50":9.0,"tradeRepublicVerified":true,"tradeRepublicCandidate":true,"trIsin":"US0000000001","isin":"US0000000001","usIsin":"US0000000001","trTicker":"TEST","trExchange":"LSX","instrumentLinkStatus":"same_isin"}],"events":[]}
          JSON

          python - <<'PY'
          from pathlib import Path
          p = Path("/tmp/catalyst-smoke/index.html")
          html = p.read_text(encoding="utf-8")
          pre = r'''<script>
          window.addEventListener('error', (e) => {
            document.documentElement.dataset.runtimeError = String((e && (e.message || (e.error && e.error.message))) || 'runtime error');
          });
          window.addEventListener('unhandledrejection', (e) => {
            document.documentElement.dataset.runtimeError = String((e && e.reason && (e.reason.message || e.reason)) || 'unhandled rejection');
          });
          </script>
          '''
          html = html.replace('<script src="app.js', pre + '<script src="app.js', 1)
          inject = r'''
          <script>
          (() => {
            const started = Date.now();

            function fail(message) {
              document.body.dataset.smokeError = String(message);
              console.error('SMOKE_FAIL', message);
            }

            function waitForProfile() {
              const chart = document.querySelector('.tv-advanced-chart');
              const profileOpen = document.body.classList.contains('stock-detail-open');
              if (chart && profileOpen) {
                document.body.dataset.smokeProfile = 'ok';
                return;
              }
              if (Date.now() - started < 7500) {
                setTimeout(waitForProfile, 100);
                return;
              }
              fail('profile or TradingView chart did not open');
              document.body.dataset.smokeProfile = 'fail';
            }

            function waitForRow() {
              const row = document.querySelector('#entryResults [data-stock-key]');
              if (row) {
                document.body.dataset.smokeApp = 'ok';
                row.click();
                setTimeout(waitForProfile, 100);
                return;
              }
              if (Date.now() - started < 6000) {
                setTimeout(waitForRow, 100);
                return;
              }
              fail('entry row was not rendered');
              document.body.dataset.smokeApp = 'fail';
            }

            setTimeout(waitForRow, 100);
          })();
          </script>
          '''
          p.write_text(html.replace("</body>", inject + "\n</body>"), encoding="utf-8")
          PY

          cd /tmp/catalyst-smoke
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/catalyst-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --user-data-dir=/tmp/catalyst-chrome-profile \
            --virtual-time-budget=10000 \
            --dump-dom \
            http://127.0.0.1:4173/ \
            > /tmp/catalyst-dom.html 2> /tmp/catalyst-chrome.log

          if ! grep -q 'data-smoke-app="ok"' /tmp/catalyst-dom.html; then
            echo "::error::La aplicación no llegó a renderizar una acción"
            grep -o 'data-smoke-[^ >]*' /tmp/catalyst-dom.html || true
            grep -o 'data-runtime-error="[^"]*"' /tmp/catalyst-dom.html || true
            python - <<'PY'
          from pathlib import Path
          dom = Path("/tmp/catalyst-dom.html").read_text(encoding="utf-8", errors="replace")
          for needle in ('id="entrySessionText"', 'id="entryCount"', 'id="entryResults"'):
              pos = dom.find(needle)
              if pos >= 0:
                  print("\nDOM DEBUG", needle)
                  print(dom[max(0, pos-250):pos+1600])
          PY
            tail -100 /tmp/catalyst-chrome.log || true
            exit 1
          fi

          if ! grep -q 'data-smoke-profile="ok"' /tmp/catalyst-dom.html; then
            echo "::error::No se pudo abrir el detalle/gráfico en navegador real"
            grep -o 'data-smoke-[^ >]*' /tmp/catalyst-dom.html || true
            tail -100 /tmp/catalyst-chrome.log || true
            exit 1
          fi

          if grep -Eqi 'Uncaught|ReferenceError|TypeError|SyntaxError|SMOKE_FAIL' /tmp/catalyst-chrome.log; then
            cat /tmp/catalyst-chrome.log
            exit 1
          fi

          echo "Smoke test navegador: OK"
