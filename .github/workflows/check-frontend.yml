          html = html.replace('<script src="app.js', pre + '<script src="app.js', 1)
          inject = r'''
          <script>
          (() => {
            const started = Date.now();
            const fail = (message) => {
              document.body.dataset.mobileSmokeError = String(message);
              console.error('MOBILE_SMOKE_FAIL', message);
            };
            const wait = (fn, message, timeout = 7000) => {
              if (fn()) return;
              if (Date.now() - started < timeout) return setTimeout(() => wait(fn, message, timeout), 100);
              fail(message);
            };
            const inputValue = (selector, value) => {
              const el = document.querySelector(selector);
              if (!el) return false;
              el.value = value;
              el.dispatchEvent(new Event('input', {bubbles:true}));
              return true;
            };

            wait(() => {
              if (document.documentElement.dataset.nativeApp !== '1' || !document.documentElement.classList.contains('native-app')) {
                fail('native application presentation mode did not initialize');
