              }
              document.body.dataset.mobileNav = 'ok';

              const fixedViews = [...document.querySelectorAll('.mobile-nav-item[data-mobile-view]')].map(x => x.dataset.mobileView);
              if (fixedViews.join(',') !== 'home,portfolios,recommendation,entry') {
                fail('fixed mobile navigation order is incorrect: ' + fixedViews.join(','));
                return true;
              }
              const more = document.querySelector('.mobile-nav-item[data-mobile-more]');
              if (!more) {
                fail('mobile More navigation item missing');
                return true;
              }
              more.click();
              const catalog = document.querySelector('.mobile-more-item[data-mobile-view="catalog"]');
              if (!catalog) {
                fail('catalog item missing from More menu');
                return true;
              }
              catalog.click();

              setTimeout(() => {
                const card = document.querySelector('#catalogResults .catalog-mobile-card');
                if (!card) {
                  fail('mobile catalog card did not render');
                  return;
                }
                document.body.dataset.mobileCatalog = 'ok';

                if (typeof catalogFilterMatch !== 'function' ||
                    !catalogFilterMatch(5, '4..6', 'number') ||
                    catalogFilterMatch(5, '6..7', 'number') ||
                    !catalogFilterMatch(250000, '200k..300k', 'number')) {
                  fail('catalog numeric range parser failed');
                  return;
                }
                document.body.dataset.mobileRange = 'ok';

                if (!inputValue('.catalog-col-filter[data-mode="tr"][data-col="tickerUs"]', 'TES')) {
                  fail('mobile column filter input missing');
                  return;
                }
                setTimeout(() => {
                  if (!document.querySelector('#catalogResults .catalog-mobile-card')) {
                    fail('matching mobile text filter removed expected result');
                    return;
                  }
                  if (!inputValue('.catalog-col-filter[data-mode="tr"][data-col="tickerUs"]', 'NOPE')) {
                    fail('mobile filter disappeared after rerender');
                    return;
                  }
                  setTimeout(() => {
                    if (document.querySelector('#catalogResults .catalog-mobile-card')) {
                      fail('non-matching mobile text filter did not remove result');
                      return;
                    }
                    document.body.dataset.mobileFilter = 'ok';

                    inputValue('.catalog-col-filter[data-mode="tr"][data-col="tickerUs"]', '');
                    setTimeout(() => {
                      const restored = document.querySelector('#catalogResults .catalog-mobile-card');
                      if (!restored) {
