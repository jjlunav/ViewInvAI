name: Auditoria de seguridad

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "score-engine.js"
      - "auth.js"
      - "portfolio.js"
      - "worker.js"
      - "backend.js"
      - "package.json"
      - "migrations/**"
      - "scripts/**"
      - "requirements*.txt"
      - ".github/workflows/**"
      - ".github/dependabot.yml"
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-security.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Instalar herramientas y dependencias
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-security.txt
          python -m pip check
      - name: CVEs de dependencias Python
        run: python -m pip_audit -r requirements.txt --strict
      - name: CVEs de dependencias JavaScript
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
      - name: Analisis estatico Python
        run: bandit -q -r scripts -ll
      - name: Compilar Python
        run: python -m compileall -q scripts
      - name: Validar JavaScript
        run: |
          node --check score-engine.js
          node --check app.js
          node --check auth.js
          node --check portfolio.js
          node --check backend.js
          node --check worker.js
      - name: Buscar patrones peligrosos, secretos y acciones sin fijar
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          from collections import Counter

          files = [
              Path("score-engine.js"), Path("app.js"), Path("auth.js"), Path("portfolio.js"), Path("backend.js"), Path("worker.js"), Path("index.html"),
              Path("scripts/update_market.py"),
              Path(".github/workflows/check-frontend.yml"),
              Path(".github/workflows/update-market-data.yml"),
              Path(".github/workflows/security-audit.yml"),
          ]
          texts = {str(p): p.read_text(encoding="utf-8") for p in files}

          app = texts["app.js"]
          names = re.findall(r"(?m)^function\s+([A-Za-z_$][\w$]*)\s*\(", app)
          duplicates = sorted(name for name, count in Counter(names).items() if count > 1)
          if duplicates:
              raise SystemExit("Funciones duplicadas: " + ", ".join(duplicates))

          dangerous = {
              "eval": r"\beval\s*\(",
              "new Function": r"\bnew\s+Function\s*\(",
              "document.write": r"\bdocument\.write\s*\(",
              "javascript URL": r"javascript\s*:",
              "Python exec": r"\bexec\s*\(",
              "Python eval": r"\beval\s*\(",
              "shell=True": r"shell\s*=\s*True",
              "verify=False": r"verify\s*=\s*False",
          }
          code_combined = "\n".join([
              texts["score-engine.js"],
              texts["app.js"],
              texts["auth.js"],
              texts["portfolio.js"],
              texts["backend.js"],
              texts["worker.js"],
              texts["scripts/update_market.py"],
          ])
          for label, pattern in dangerous.items():
              if re.search(pattern, code_combined, re.I):
                  raise SystemExit("Patron peligroso detectado: " + label)

          secrets = {
              "GitHub token": r"\bgh[pousr]_[A-Za-z0-9_]{20,}\b",
              "GitHub PAT": r"\bgithub_pat_[A-Za-z0-9_]{20,}\b",
              "OpenAI-style key": r"\bsk-[A-Za-z0-9_-]{20,}\b",
              "AWS access key": r"\bAKIA[0-9A-Z]{16}\b",
              "Private key": r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----",
          }
          all_text = "\n".join(texts.values())
          for label, pattern in secrets.items():
              if re.search(pattern, all_text):
                  raise SystemExit("Posible secreto embebido: " + label)

          # Revisa tambien el historial de codigo, excluyendo market.json porque
          # se actualiza continuamente y no contiene credenciales.
          import subprocess
          history = subprocess.run(
              ["git", "log", "--all", "-p", "--no-color", "--", ".", ":(exclude)data/market.json"],
              check=True, capture_output=True, text=True
          ).stdout
          for label, pattern in secrets.items():
              if re.search(pattern, history):
                  raise SystemExit("Posible secreto historico: " + label)

          for path, text in texts.items():
              if not path.endswith((".yml", ".yaml")):
                  continue
              for line in text.splitlines():
                  m = re.match(r"^\s*-\s+uses:\s*([^\s#]+)", line)
                  if not m:
                      continue
                  ref = m.group(1)
                  if "@" not in ref:
                      raise SystemExit(f"Action sin version en {path}: {ref}")
                  version = ref.rsplit("@", 1)[1]
                  if not re.fullmatch(r"[0-9a-f]{40}", version):
                      raise SystemExit(f"Action no fijada a SHA en {path}: {ref}")

          assetsignore = Path(".assetsignore").read_text(encoding="utf-8")
          for required in [".github/", "scripts/", "wrangler.jsonc", "worker.js", "backend.js", "migrations/"]:
              if required not in assetsignore:
                  raise SystemExit("Falta proteger en .assetsignore: " + required)

          print("Auditoria estatica local: OK")
          PY
