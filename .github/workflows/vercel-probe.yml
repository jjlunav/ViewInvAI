name: Comprobar Vercel (temporal)
on:
  push:
    branches: [claude/keen-cannon-ui2j3n]
    paths: [.github/workflows/vercel-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vercel y Netlify
        run: |
          for base in https://viewinvai-data.vercel.app https://viewinvai-data.netlify.app; do
            echo "== $base"
            curl -s -m 20 -o /tmp/v -w "app-version %{http_code}\n" "$base/app-version.txt"; head -c 60 /tmp/v; echo
          done
          curl -s -m 40 -o /tmp/m -w "vercel market-server %{http_code} %{size_download}B %{time_total}s\n" -H "Content-Type: application/json" -d '{"targets":[{"stock_key":"NASDAQ:AAPL"}]}' https://viewinvai-data.vercel.app/api/market-server; head -c 160 /tmp/m; echo
          curl -s -m 40 -o /tmp/l -w "vercel market-live %{http_code} %{size_download}B %{time_total}s\n" https://viewinvai-data.vercel.app/api/market-live; head -c 120 /tmp/l; echo
          curl -s -m 40 -o /tmp/n -w "netlify market-server %{http_code} %{time_total}s\n" -H "Content-Type: application/json" -d '{"targets":[{"stock_key":"NASDAQ:AAPL"}]}' https://viewinvai-data.netlify.app/market-server; head -c 120 /tmp/n; echo
