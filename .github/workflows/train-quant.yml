name: Modelo cuantitativo (pruebas retrospectivas)

# Reentrena cada semana con ~10 años de cotizaciones diarias (Nasdaq, gratuito) y publica
# data/quant-model.json y data/quant-backtest.json en la misma rama.
on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:
  push:
    branches: [claude/keen-cannon-ui2j3n]
    paths: [scripts/quant/**, .github/workflows/train-quant.yml]

permissions:
  contents: write

concurrency:
  group: train-quant
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "scripts/quant/requirements.txt"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Caché de históricos
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .quant-cache
          key: quant-history-${{ github.run_id }}
          restore-keys: quant-history-
      - name: Instalar dependencias fijadas
        run: python -m pip install --disable-pip-version-check -r scripts/quant/requirements.txt
      - name: Descargar históricos, entrenar y probar
        run: python scripts/quant/train_quant.py
      - name: Publicar el modelo y el informe
        run: |
          git config user.name "viewinvai-quant[bot]"
          git config user.email "quant@viewinvai.invalid"
          git add data/quant-model.json data/quant-backtest.json
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -m "Modelo cuantitativo: reentrenado con históricos"
          for i in 1 2 3 4; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push --quiet origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
