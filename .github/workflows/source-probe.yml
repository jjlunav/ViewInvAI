name: Probar fuentes nuevas

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/source-probe.yml"
      - "scripts/probe_sources.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Probar fuentes
        run: python scripts/probe_sources.py
