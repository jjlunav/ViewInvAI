name: Build ViewInvAI Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "mobile-shell/**"
      - ".github/workflows/build-android.yml"
      - "scripts/apply_android_branding.py"
      - "firebase/**"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "capacitor.config.json"
      - "mobile-shell/**"
      - ".github/workflows/build-android.yml"
      - "scripts/apply_android_branding.py"
      - "firebase/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore stable debug signing key
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.android/debug.keystore
          key: viewinvai-android-debug-keystore-v1

      - name: Create debug signing key when missing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=ViewInvAI Development,O=ViewInvAI,C=ES" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:|Valid from:"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx cap add android

      - name: Add Firebase Android configuration
        run: |
          set -euo pipefail
          cp firebase/google-services.json android/app/google-services.json
          test -s android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/build.gradle")
          text = root.read_text(encoding="utf-8")
          dep = "classpath 'com.google.gms:google-services:4.5.0'"
          if dep not in text:
              marker = "classpath 'com.android.tools.build:gradle:"
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit("Android Gradle classpath anchor not found")
              line_end = text.find("\n", pos)
              text = text[:line_end+1] + "        " + dep + "\n" + text[line_end+1:]
              root.write_text(text, encoding="utf-8")

          app = Path("android/app/build.gradle")
          text = app.read_text(encoding="utf-8")
          apply = "apply plugin: 'com.google.gms.google-services'"
          if apply not in text:
              text = text.rstrip() + "\n\n" + apply + "\n"
              app.write_text(text, encoding="utf-8")

          variables = Path("android/variables.gradle")
          text = variables.read_text(encoding="utf-8")
          if "rgcfaIncludeGoogle" not in text:
              marker = "ext {"
              if marker not in text:
                  raise SystemExit("variables.gradle ext block not found")
              text = text.replace(marker, marker + "\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'", 1)
              variables.write_text(text, encoding="utf-8")
          PY

      - name: Apply ViewInvAI Android icon
        run: python3 scripts/apply_android_branding.py

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare named APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p dist
          APK="dist/ViewInvAI-v${VERSION}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ViewInvAI-Android-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
