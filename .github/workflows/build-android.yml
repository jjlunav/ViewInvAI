name: Build ViewInvAI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/apk-build-trigger"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore stable signing key from repository secret
        id: signing-secret
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ -n "${ANDROID_DEBUG_KEYSTORE_BASE64}" ]; then
            printf '%s' "${ANDROID_DEBUG_KEYSTORE_BASE64}" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "source=secret" >> "$GITHUB_OUTPUT"
          else
            echo "source=legacy-cache" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secret not configured; using the legacy cache temporarily."
          fi

      - name: Restore legacy stable debug signing key
        if: steps.signing-secret.outputs.source == 'legacy-cache'
        id: signing-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.android/debug.keystore
          key: viewinvai-android-debug-keystore-v1

      - name: Verify stable debug signing key
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "::error::Stable Android signing key is missing. Refusing to generate a new key because that would prevent APK updates and break the Firebase Android OAuth fingerprint."
            exit 1
          fi
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:|Valid from:"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build packaged mobile frontend
        run: |
          npm run mobile:build
          test -s mobile-shell/index.html
          test -s mobile-shell/styles.css
          test -s mobile-shell/ui-density.css
          test -s mobile-shell/asset-card.js
          test -s mobile-shell/asset-card.css
          test -s mobile-shell/theme-ai.css
          test -s mobile-shell/filter-sheet.js
          test -s mobile-shell/stock-profile.js
          test -s mobile-shell/portfolio.js
          test -s mobile-shell/funds.js
          test -s mobile-shell/recommendation.js
          test -s mobile-shell/stock-notifications.js
          test -s mobile-shell/native-runtime.js
          grep -q 'function recommendationCompactView' mobile-shell/recommendation.js
          grep -q 'function recommendationMobileList' mobile-shell/recommendation.js
          grep -q 'html\[data-native-app="1"\] .notification-bell' mobile-shell/mobile-app.css
          grep -q 'position:absolute!important' mobile-shell/mobile-app.css
          VERSION="$(node -p "require('./package.json').version")"
          grep -q "data-app-version=\"${VERSION}\"" mobile-shell/index.html
          test -s mobile-shell/data/market.json
          test -s mobile-shell/data/market-version.json
          test -s mobile-shell/data/funds.json
          grep -q 'const native = true' mobile-shell/index.html
          if grep -q '"url"[[:space:]]*:[[:space:]]*"https://viewinvai' capacitor.config.json; then
            echo "::error::Android config still points at the remote web shell."
            exit 1
          fi

      - name: Smoke test packaged Android frontend
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::Chrome/Chromium no está disponible en el runner"
            exit 1
          fi
          QA_SHELL="/tmp/viewinvai-native-smoke-shell"
          rm -rf "$QA_SHELL" /tmp/viewinvai-native-profile
          cp -a mobile-shell "$QA_SHELL"
          mkdir -p /tmp/viewinvai-native-profile
          export QA_SHELL
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ["QA_SHELL"])/"index.html"
          html=p.read_text(encoding="utf-8")
          inject=r"""
          <script>
          (() => {
            const started=Date.now();
            const fail=m=>{document.documentElement.dataset.nativeSmoke='fail';document.documentElement.dataset.nativeSmokeError=String(m);console.error('NATIVE_SMOKE_FAIL',m)};
            const wait=()=>{
              try{
                if(!window.ViewInvAI||!window.ViewInvAIFunds||!window.ViewInvAI.getAllStocks().length){
                  if(Date.now()-started<8000)return setTimeout(wait,100);
                  return fail('runtime did not initialize');
                }
                const nav=document.querySelector('#mobileBottomNav'),items=nav?[...nav.querySelectorAll(':scope > .mobile-nav-item')]:[];
                const order=items.map(item=>item.dataset.mobileView||'more').join('|');
                if(items.length!==5||order!=='home|portfolios|recommendation|favorites|more')return fail('bottom nav order invalid: '+order);
                const navRect=nav.getBoundingClientRect(),radar=nav.querySelector('[data-mobile-view="recommendation"]'),radarRect=radar.getBoundingClientRect();
                if(radarRect.top<navRect.top-1||radarRect.bottom>navRect.bottom+1)return fail('Radar AI protrudes outside bottom bar');
                const centers=items.map(item=>{const r=item.getBoundingClientRect();return r.left+r.width/2}),gaps=centers.slice(1).map((value,index)=>value-centers[index]);
                if(Math.max(...gaps)-Math.min(...gaps)>3)return fail('bottom nav items are not centered evenly');
                const more=document.querySelector('#mobileBottomNav [data-mobile-more]');
                more?.click();
                if(!document.querySelector('#mobileMoreSheet [data-mobile-view="funds"]'))return fail('funds missing from More menu');
                document.querySelector('#mobileMoreSheet [data-mobile-view="funds"]')?.click();
                if(!document.querySelector('#view-funds.active'))return fail('funds view did not open');
                const stock=window.ViewInvAI.getAllStocks().find(s=>s&&(s.tvSymbol||s.ticker));
                if(!stock)return fail('no usable stock');
                const key=window.ViewInvAI.getStockKey(stock);
                if(!window.ViewInvAI.openStockByKey(key,'APK smoke',true))return fail('global detail did not open');
                setTimeout(()=>{
                  const detail=document.querySelector('#stockQuickDetail');
                  if(!detail||detail.classList.contains('is-hidden'))return fail('stock detail hidden');
                  if(document.querySelectorAll('#stockQuickDetail .unified-stock-header').length!==1)return fail('stock detail duplicated');
                  if(typeof window.ViewInvAI.renderEmbeddedStockDetail==='function')return fail('obsolete embedded stock detail API remains');
                  const nav=document.querySelector('#mobileBottomNav'),shell=detail.querySelector('.profile-sticky-shell');
                  if(!nav||getComputedStyle(nav).display==='none')return fail('bottom navigation hidden in detail');
                  if(!shell||getComputedStyle(shell).position!=='fixed')return fail('pinned stock shell missing');
                  const general=detail.querySelector('[data-profile-panel="general"]'),chart=detail.querySelector('[data-profile-panel="chart"]'),ai=detail.querySelector('[data-profile-panel="ai"]');
                  if(!general||general.hidden||!chart||!chart.hidden||!ai||!ai.hidden)return fail('default stock tab state invalid');
                  if(!detail.querySelector('.profile-quote-lsx')||detail.querySelector('.profile-quote-extended'))return fail('TR detail mixed LSX with US extended session');
                  if(!detail.querySelector('.profile-market-extra'))return fail('fixed market data missing from General');
                  if(detail.querySelector('.profile-market-sessions'))return fail('TR detail exposes US pre/post sessions');
                  if(detail.querySelector('[data-profile-panel="general"] details'))return fail('General market data is still collapsible');
                  if(!detail.querySelector('[data-quote-freshness-key]'))return fail('freshness indicator missing');
                  detail.querySelector('[data-profile-tab="chart"]')?.click();
                  setTimeout(()=>{
                    if(chart.hidden||!general.hidden)return fail('chart tab failed');
                    detail.dataset.profileChartLoadedKey='__stale_stock__';
                    const next=window.ViewInvAI.getAllStocks().find(s=>window.ViewInvAI.getStockKey(s)!==key);
                    if(next&&typeof state==='object'&&typeof renderQuickProfile==='function'){
                      state.profileKey=window.ViewInvAI.getStockKey(next);state.profilePreferTr=false;renderQuickProfile();
                      if(detail.dataset.profileChartLoadedKey==='__stale_stock__')return fail('tab load state leaked across stocks');
                    }
                    document.documentElement.dataset.nativeSmoke='ok';
                  },150);
                },250);
              }catch(e){fail(e&&(e.stack||e.message)||e)}
            };
            setTimeout(wait,150);
          })();
          </script>
          """
          p.write_text(html.replace("</body>",inject+"\n</body>"),encoding="utf-8")
          PY
          cd "$QA_SHELL"
          python -m http.server 4182 --bind 127.0.0.1 >/tmp/viewinvai-native-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=412,915 --force-device-scale-factor=1 --user-data-dir=/tmp/viewinvai-native-profile --virtual-time-budget=12000 --dump-dom http://127.0.0.1:4182/ > /tmp/viewinvai-native-dom.html 2>/tmp/viewinvai-native-chrome.log
          if ! grep -q 'data-native-smoke="ok"' /tmp/viewinvai-native-dom.html; then
            echo "::error::El frontend empaquetado no supera el recorrido funcional nativo"
            grep -o 'data-native-smoke-error="[^"]*"' /tmp/viewinvai-native-dom.html || true
            tail -100 /tmp/viewinvai-native-chrome.log || true
            exit 1
          fi
          echo "Packaged Android frontend smoke: OK"

      - name: Verify Android layout guards
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'profile-sticky-shell' mobile-shell/mobile-app.css
          grep -q 'position:fixed!important' mobile-shell/mobile-app.css
          grep -q 'body.stock-detail-open .mobile-bottom-nav' mobile-shell/mobile-app.css
          grep -q 'display:grid!important' mobile-shell/mobile-app.css
          grep -q '#view-portfolios .portfolio-position-list.stock-list' mobile-shell/mobile-app.css
          grep -q 'grid-template-columns:minmax(0,1fr)!important' mobile-shell/mobile-app.css
          grep -q 'Funds / ETFs native layout' mobile-shell/mobile-app.css
          echo "Android layout guards: OK"

      - name: Generate Android project
        run: npx cap add android

      - name: Harden Android manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path = Path("android/app/src/main/AndroidManifest.xml")
          if not path.is_file():
              raise SystemExit("AndroidManifest.xml was not generated")
          android = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android)
          tree = ET.parse(path)
          root = tree.getroot()
          app = root.find("application")
          if app is None:
              raise SystemExit("Android application node missing")
          app.set(f"{{{android}}}usesCleartextTraffic", "false")
          app.set(f"{{{android}}}allowBackup", "false")
          tree.write(path, encoding="utf-8", xml_declaration=True)
          check = path.read_text(encoding="utf-8")
          if 'android:usesCleartextTraffic="false"' not in check or 'android:allowBackup="false"' not in check:
              raise SystemExit("Android manifest hardening was not applied")
          print("Android manifest hardened.")
          PY

      - name: Set Android app version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          version = json.load(open("package.json", encoding="utf-8"))["version"]
          m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", version)
          if not m:
              raise SystemExit(f"Unsupported version format: {version}")
          major, minor, patch = map(int, m.groups())
          version_code = 1000000 + int(__import__("os").environ["GITHUB_RUN_NUMBER"])
          if version_code <= 0:
              raise SystemExit("Android versionCode must be positive")

          path = Path("android/app/build.gradle")
          text = path.read_text(encoding="utf-8")
          text, n1 = re.subn(r"versionCode\s+\d+", f"versionCode {version_code}", text, count=1)
          text, n2 = re.subn(r'versionName\s+"[^"]+"', f'versionName "{version}"', text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Could not patch Android versionCode/versionName")

          # Force the APK to use the stable cached key that is registered in Firebase.
          # Android's implicit debug signing was using a different runner key.
          if "viewinvaiDebug" not in text:
              signing = """
              signingConfigs {
                  viewinvaiDebug {
                      storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          """
              text = text.replace("    buildTypes {", signing + "\n    buildTypes {", 1)
              text = text.replace("    buildTypes {\n", "    buildTypes {\n        debug {\n            signingConfig signingConfigs.viewinvaiDebug\n        }\n", 1)

          path.write_text(text, encoding="utf-8")
          print(f"Android versionName={version} versionCode={version_code} with stable ViewInvAI signing")
          PY

      - name: Add Firebase Android configuration
        run: |
          set -euo pipefail
          cp firebase/google-services.json android/app/google-services.json
          test -s android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/build.gradle")
          text = root.read_text(encoding="utf-8")
          dep = "classpath 'com.google.gms:google-services:4.5.0'"
          if dep not in text:
              marker = "classpath 'com.android.tools.build:gradle:"
              pos = text.find(marker)
              if pos < 0:
                  raise SystemExit("Android Gradle classpath anchor not found")
              line_end = text.find("\n", pos)
              text = text[:line_end+1] + "        " + dep + "\n" + text[line_end+1:]
              root.write_text(text, encoding="utf-8")

          app = Path("android/app/build.gradle")
          text = app.read_text(encoding="utf-8")
          apply = "apply plugin: 'com.google.gms.google-services'"
          if apply not in text:
              text = text.rstrip() + "\n\n" + apply + "\n"
              app.write_text(text, encoding="utf-8")

          variables = Path("android/variables.gradle")
          text = variables.read_text(encoding="utf-8")
          if "rgcfaIncludeGoogle" not in text:
              marker = "ext {"
              if marker not in text:
                  raise SystemExit("variables.gradle ext block not found")
              text = text.replace(marker, marker + "\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'", 1)
              variables.write_text(text, encoding="utf-8")
          PY

      - name: Verify Firebase signing fingerprint
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA1="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk '/SHA1:/{gsub(":","",$2); print tolower($2); exit}')"
          EXPECTED_SHA1="$(python3 - <<'PY'
          import json
          data = json.load(open("firebase/google-services.json", encoding="utf-8"))
          for client in data.get("client", []):
              for oauth in client.get("oauth_client", []):
                  info = oauth.get("android_info") or {}
                  if oauth.get("client_type") == 1 and info.get("package_name") == "com.viewinvai.mobile":
                      print(str(info.get("certificate_hash", "")).replace(":", "").lower())
                      raise SystemExit
          PY
          )"
          if [ -z "$EXPECTED_SHA1" ] || [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "::error::Firebase Android OAuth SHA-1 does not match the APK signing key."
            echo "Actual:   $ACTUAL_SHA1"
            echo "Expected: $EXPECTED_SHA1"
            exit 1
          fi
          echo "Firebase SHA-1 matches APK signing key: $ACTUAL_SHA1"

      - name: Apply ViewInvAI Android icon
        run: python3 scripts/apply_android_branding.py

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Verify generated Google OAuth resources
        shell: bash
        run: |
          set -euo pipefail
          VALUES="$(grep -R -l 'default_web_client_id' android/app/build/generated/res 2>/dev/null | head -n 1 || true)"
          if [ -z "$VALUES" ] || [ ! -s "$VALUES" ]; then
            echo "::error::Could not find generated Google services values.xml"
            find android/app/build/generated/res -maxdepth 5 -type f -name '*.xml' -print || true
            exit 1
          fi
          python3 - "$VALUES" <<'PY'
          import json, sys, xml.etree.ElementTree as ET
          values = sys.argv[1]
          data=json.load(open("firebase/google-services.json", encoding="utf-8"))
          expected_web=""
          expected_app="1:638735053048:android:beb0c00ef0f50a90820b0d"
          for client in data.get("client", []):
              for oauth in client.get("oauth_client", []):
                  if oauth.get("client_type") == 3:
                      expected_web = oauth.get("client_id", "")
                      break
              if expected_web:
                  break
          root=ET.parse(values).getroot()
          strings={x.attrib.get("name"): (x.text or "").strip() for x in root.findall("string")}
          actual_web=strings.get("default_web_client_id","")
          actual_app=strings.get("google_app_id","")
          if actual_web != expected_web:
              raise SystemExit(f"default_web_client_id mismatch: {actual_web!r} != {expected_web!r}")
          if actual_app != expected_app:
              raise SystemExit(f"google_app_id mismatch: {actual_app!r} != {expected_app!r}")
          print("Generated Firebase OAuth resources match google-services.json.")
          PY

      - name: Audit final APK permissions
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump permissions "$APK" | tee /tmp/viewinvai-apk-permissions.txt
          grep -q "android.permission.INTERNET" /tmp/viewinvai-apk-permissions.txt
          grep -q "android.permission.POST_NOTIFICATIONS" /tmp/viewinvai-apk-permissions.txt
          grep -q "com.google.android.c2dm.permission.RECEIVE" /tmp/viewinvai-apk-permissions.txt
          FORBIDDEN=(
            android.permission.ACCESS_FINE_LOCATION
            android.permission.ACCESS_COARSE_LOCATION
            android.permission.CAMERA
            android.permission.RECORD_AUDIO
            android.permission.READ_CONTACTS
            android.permission.WRITE_CONTACTS
            android.permission.READ_CALENDAR
            android.permission.WRITE_CALENDAR
            android.permission.READ_SMS
            android.permission.SEND_SMS
            android.permission.RECEIVE_SMS
            android.permission.READ_PHONE_STATE
            android.permission.CALL_PHONE
            android.permission.READ_CALL_LOG
            android.permission.WRITE_CALL_LOG
            android.permission.BODY_SENSORS
            android.permission.ACTIVITY_RECOGNITION
            android.permission.READ_EXTERNAL_STORAGE
            android.permission.WRITE_EXTERNAL_STORAGE
            android.permission.MANAGE_EXTERNAL_STORAGE
            android.permission.READ_MEDIA_IMAGES
            android.permission.READ_MEDIA_VIDEO
            android.permission.READ_MEDIA_AUDIO
            android.permission.REQUEST_INSTALL_PACKAGES
            android.permission.SYSTEM_ALERT_WINDOW
            android.permission.QUERY_ALL_PACKAGES
            android.permission.PACKAGE_USAGE_STATS
          )
          for permission in "${FORBIDDEN[@]}"; do
            if grep -Fq "$permission" /tmp/viewinvai-apk-permissions.txt; then
              echo "::error::Forbidden Android permission detected: $permission"
              exit 1
            fi
          done
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > /tmp/viewinvai-apk-manifest.txt
          if ! grep -E 'usesCleartextTraffic.*0x0' /tmp/viewinvai-apk-manifest.txt >/dev/null; then
            echo "::error::Final APK does not explicitly disable cleartext traffic"
            exit 1
          fi
          echo "Final APK permission and cleartext audit: OK"

      - name: Verify APK signer
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apk-signature.txt
          grep -qi 'a1598523374da7b327e881f94ed77dd8b96f7d79' /tmp/apk-signature.txt
          echo "APK signer SHA-1 matches Firebase."

      - name: Prepare named APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p dist
          APK="dist/ViewInvAI-v${VERSION}-build${GITHUB_RUN_NUMBER}-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ViewInvAI-Android-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14
