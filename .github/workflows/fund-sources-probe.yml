name: Diagnóstico fuentes de fondos (temporal)

on:
  push:
    branches: [claude/keen-cannon-ui2j3n]
    paths:
      - "scripts/fund_sources_probe.py"
      - "scripts/update_funds.py"
      - ".github/workflows/fund-sources-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Probar fuentes
        run: |
          true
          python scripts/fund_sources_probe.py
