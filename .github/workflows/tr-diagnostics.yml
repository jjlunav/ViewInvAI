name: Diagnóstico Trade Republic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tr-diagnostics.yml"
      - "scripts/tr_diagnostics.py"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Comprobar Worker y conexión directa
        run: |
          python -m pip install --quiet "websockets==13.1"
          python scripts/tr_diagnostics.py
